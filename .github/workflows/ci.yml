name: UNA CI

# What runs, and when (docs/ci.md is the team's version of this):
# - `changes` reads the diff once. Every other job runs only when it has something to do, so a
#   neo-only PR runs no PHPUnit and a PHP-only PR runs no NEO lint.
# - Pushes to master always run the whole PHPUnit suite. PRs run it whenever anything outside neo/
#   changed (or the API client's openapi.json, which ApiV2SpecFileTest compares with the PHP code).
# - PR previews on Railway are opt-in: a PR gets one once it has the `preview` label
#   (preview.yml starts this workflow for it), and each later push deploys only the half that
#   changed. Master deploys the half that changed to production.
# - "[no deploy]" in a PR title or in the head commit on master skips every deploy; the tests
#   still run. "Run workflow" on master deploys both halves by hand.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to build a preview for (empty on master deploys production)
        required: false
        default: ''
      deploy:
        description: Deploy the PR's preview (false only runs the checks)
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

env:
  # What the dependency cache holds: Composer's plugins/ and what the yarn build writes.
  DEPS_PATHS: |
    plugins
    plugins_public
    modules/boonex/messenger/js/emoji
    modules/boonex/messenger/template/css/*.css

# A newer push to a PR cancels that PR's run in progress. preview.yml joins the same group when a
# PR is closed or loses its `preview` label, so the teardown can't race a preview deploy that is
# still creating the environment. Master pushes never cancel.
concurrency:
  group: ${{ (github.event.pull_request.number || inputs.pr) && format('ci-pr-{0}', github.event.pull_request.number || inputs.pr) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr != '' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      pr: ${{ steps.plan.outputs.pr }}
      test_una: ${{ steps.plan.outputs.test_una }}
      lint_neo: ${{ steps.plan.outputs.lint_neo }}
      deploy_una: ${{ steps.plan.outputs.deploy_una }}
      deploy_neo: ${{ steps.plan.outputs.deploy_neo }}
      deps_key: ${{ steps.plan.outputs.deps_key }}
      timings_key: ${{ steps.timings.outputs.cache-matched-key }}
    steps:
    # History without file contents: enough for `git diff --name-only` and `git ls-tree`, about
    # 3 s instead of 30.
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: .github

    # One snapshot of master's timings for every leg, so the legs of one PHP version all split
    # Integration the same way even when master saves new timings meanwhile.
    - name: Pick master's test timings
      id: timings
      uses: actions/cache/restore@v6
      with:
        key: phpunit-timings-${{ github.run_id }}
        restore-keys: phpunit-timings-
        path: phpunit-timings.json
        lookup-only: true

    - name: Decide what runs
      id: plan
      env:
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        REF: ${{ github.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        BEFORE: ${{ github.event.before }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        INPUT_DEPLOY: ${{ inputs.deploy }}
      run: |
        # No pipefail: `grep -q` may close the pipe before printf is done.
        set -eu
        out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }

        if [ -n "$PR_NUMBER" ]; then mode=pr; else mode=production; fi
        out mode "$mode"
        out pr "$PR_NUMBER"

        # The dependency cache holds what `composer install` and `yarn install` produce, so its key
        # covers everything they read: the lockfiles and patches, and the sources the yarn build
        # compiles (src/, the AG Grid entry, the messenger module, and every template and script
        # Tailwind scans for class names; see tailwind.config.js). It is a superset on purpose:
        # an extra miss costs one install, a missing input ships stale assets. The ids come from
        # git's trees, so no file is downloaded. The month keeps the unpinned installs (messenger,
        # bower) from staying frozen for long.
        inputs='^(composer\.(json|lock)|package\.json|yarn\.lock|bower\.json|tsconfig[^/]*\.json|rollup\.config\.js|tailwind\.config[^/]*\.js|patches/|scripts/|src/|inc/js/|template/|studio/template/|modules/base/|modules/[^/]+/[^/]+/(js|template|data/template)/|modules/boonex/messenger/)'
        deps_hash=$(git ls-tree -r --full-tree HEAD | re="$inputs" awk -F '\t' '$2 ~ ENVIRON["re"]' | sha256sum | cut -c1-40)
        out deps_key "una-deps-v2-$(date -u +%Y-%m)-$deps_hash"

        # Which files changed. Everything counts as changed when the range is unknown.
        all=false
        if [ "$EVENT" = pull_request ] || [ "$mode" = pr ]; then
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
        elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          files=$(git diff --name-only "$BEFORE" HEAD)
        else
          files=''; all=true
        fi
        echo "Changed files: $(printf '%s\n' "$files" | grep -c . || true)"

        has() { [ "$all" = true ] || printf '%s\n' "$files" | grep -qE "$1"; }
        # These change how CI itself runs, so they run everything.
        if has '^\.github/(workflows/(ci|preview)\.yml|actions/|scripts/)'; then all=true; fi
        una=false; neo=false; neo_deploy=false
        { [ "$all" = true ] || printf '%s\n' "$files" | grep -v '^neo/' | grep -q .; } && una=true
        has '^neo/desktop/una-api/openapi\.json$' && una=true
        has '^neo/' && neo=true
        has '^(neo/|scripts/railway/neo)' && neo_deploy=true

        # The marker is matched without regard to case. A preview started by preview.yml reads the
        # title from the PR, so the marker holds there too.
        if [ "$EVENT" = workflow_dispatch ] && [ "$mode" = pr ]; then
          PR_TITLE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .title)
        fi
        if [ "$mode" = pr ]; then text=$PR_TITLE; else text=$COMMIT_MESSAGE; fi
        no_deploy=false
        printf '%s' "$text" | grep -qi '\[no deploy\]' && no_deploy=true

        if [ "$mode" = production ]; then
          # Master always runs the whole suite. A push deploys the half that changed; "Run
          # workflow" on master deploys both.
          out test_una true
          out lint_neo false
          deploy_una=$una; deploy_neo=$neo_deploy
          if [ "$EVENT" = workflow_dispatch ]; then deploy_una=true; deploy_neo=true; fi
          if [ "$REF" != refs/heads/master ] || [ "$no_deploy" = true ]; then deploy_una=false; deploy_neo=false; fi
        else
          out test_una "$una"
          out lint_neo "$neo"
          # Previews: same-repo PRs only (forks and Dependabot get no secrets), with the label.
          # The first build of an environment deploys both halves.
          preview=false
          # preview.yml dispatches with deploy=false to bring back checks a teardown cancelled.
          if [ "$EVENT" = workflow_dispatch ]; then
            first=true
            [ "$INPUT_DEPLOY" != false ] && preview=true
          else
            printf '%s' "$PR_LABELS" | grep -q '"preview"' && preview=true
            first=false; case "$ACTION" in opened|reopened) first=true;; esac
          fi
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$PR_AUTHOR" = 'dependabot[bot]' ] || [ "$no_deploy" = true ]; then preview=false; fi
          deploy_una=false; deploy_neo=false
          if [ "$preview" = true ]; then
            { [ "$una" = true ] || [ "$first" = true ]; } && deploy_una=true
            { [ "$neo_deploy" = true ] || [ "$first" = true ]; } && deploy_neo=true
          fi
        fi
        out deploy_una "$deploy_una"
        out deploy_neo "$deploy_neo"

  dependencies:
    # Composer (plugins/) and Yarn (plugins_public/, via the postinstall build) are the same tree
    # for every leg. They are cached under a key of the lockfiles and the build's inputs, so most
    # runs only look the cache up; a miss installs once here and the legs restore it.
    name: Install dependencies
    needs: changes
    if: needs.changes.outputs.test_una == 'true' || needs.changes.outputs.deploy_una == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Look up the cache
      id: lookup
      uses: actions/cache/restore@v6
      with:
        key: ${{ needs.changes.outputs.deps_key }}
        path: ${{ env.DEPS_PATHS }}
        lookup-only: true

    - uses: actions/checkout@v6
      if: steps.lookup.outputs.cache-hit != 'true'
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/upgrade/

    # WARNING: after `composer update` or `composer upgrade`, replace this commit SHA
    # with the current shivammathur/setup-php release. Every Setup PHP step must match.
    - name: Setup PHP
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: intl, curl, gd, mbstring, zip, exif, pdo_mysql
        ini-values: short_open_tag=On, memory_limit=256M
        tools: composer

    - name: Setup Node
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: yarn

    - name: Install PHP dependencies
      if: steps.lookup.outputs.cache-hit != 'true'
      run: composer install --prefer-dist --no-progress --no-dev

    - name: Install JS dependencies
      if: steps.lookup.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile

    - name: Save the cache
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ needs.changes.outputs.deps_key }}
        path: ${{ env.DEPS_PATHS }}

  test:
    # Two legs per PHP version, each with its own database: Units and half of Integration, and the
    # other half. phpunit-shard.php balances the halves by the seconds master last recorded and
    # "Tests" checks that every Integration file ran exactly once. The names are the required
    # checks of the master ruleset, so the legs always start (a skipped matrix job reports under
    # its unexpanded name, and the PR would wait for these forever); with nothing to test their
    # steps are skipped. "Unit tests" also runs half of Integration.
    name: ${{ matrix.shard == 1 && 'Unit tests' || 'Integration tests' }} (PHP ${{ matrix.php }})
    needs: [changes, dependencies]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RUN_TESTS: ${{ needs.changes.outputs.test_una }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        shard: [1, 2]

    # Only the tests need the database: an empty image keeps the service from starting.
    services:
      mysql:
        image: ${{ needs.changes.outputs.test_una == 'true' && 'mariadb:11' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: una
          MYSQL_USER: una
          MYSQL_PASSWORD: una
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    # upgrade/ is two thirds of the tree, and nothing the tests load reads it.
    - uses: actions/checkout@v6
      if: env.RUN_TESTS == 'true'
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/upgrade/

    # WARNING: after `composer update` or `composer upgrade`, replace this commit SHA
    # with the current shivammathur/setup-php release. Every Setup PHP step must match.
    - name: Setup PHP
      if: env.RUN_TESTS == 'true'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, curl, gd, mbstring, zip, exif, pdo_mysql
        ini-values: short_open_tag=On, memory_limit=256M
        tools: phpunit:12

    - name: Restore dependencies
      if: env.RUN_TESTS == 'true'
      uses: actions/cache/restore@v6
      with:
        key: ${{ needs.changes.outputs.deps_key }}
        path: ${{ env.DEPS_PATHS }}
        fail-on-cache-miss: true

    - name: Restore master's test timings
      if: env.RUN_TESTS == 'true' && needs.changes.outputs.timings_key != ''
      uses: actions/cache/restore@v6
      with:
        key: ${{ needs.changes.outputs.timings_key }}
        path: phpunit-timings.json
        fail-on-cache-miss: true

    - name: Plan this shard
      if: env.RUN_TESTS == 'true'
      run: php .github/scripts/phpunit-shard.php plan ${{ matrix.shard }} 2 phpunit-timings.json

    - name: Prepare writable paths
      if: env.RUN_TESTS == 'true'
      run: |
        mkdir -p cache cache_public logs tmp storage
        chmod a+rwX inc cache cache_public logs tmp storage
        test -f plugins/ffmpeg/ffmpeg.exe && chmod 0755 plugins/ffmpeg/ffmpeg.exe

    # The installer creates admin@example.com. Integration tests also sign in as user@example.com.
    - name: Install UNA
      id: install
      if: env.RUN_TESTS == 'true'
      run: |
        # OAuth before the modules that require it. English, Artificer and Persons are the
        # installer's own language, template and profile type, so they are repeated first.
        # Timeline and Notifications next, so later modules can register with them.
        modules=$(printf '%s,' \
          bx_oauth \
          bx_en \
          bx_artificer \
          bx_persons \
          bx_notifications \
          bx_timeline \
          bx_accounts \
          bx_ai_proxy \
          bx_albums \
          bx_analytics \
          bx_antispam \
          bx_api \
          bx_channels \
          bx_convos \
          bx_developer \
          bx_editor \
          bx_events \
          bx_forum \
          bx_groups \
          bx_invites \
          bx_market \
          bx_massmailer \
          bx_messenger \
          bx_posts \
          bx_payment \
          bx_tasks \
          bx_resources \
          bx_ru \
        )
        modules=${modules%,}
        php install/cmd.php \
          -m "$modules" \
          --db_host=127.0.0.1 \
          --db_name=una \
          --db_user=una \
          --db_password=una \
          --server_http_host=localhost \
          --server_php_self=/install/index.php
        php tests/seed.php

    # Units read install/sql, so they run while the install folder is there.
    - name: Run Units
      if: env.RUN_TESTS == 'true' && matrix.shard == 1
      run: phpunit -c tests/phpunit.xml --testsuite Units --log-junit logs/junit-units.xml

    # Every script which loads inc/header.inc.php redirects to the installer while the install
    # folder exists, as a site served over HTTP (storage.php) would.
    # Runs even when Units failed, so one leg reports both.
    - name: Run Integration
      if: ${{ !cancelled() && env.RUN_TESTS == 'true' && steps.install.outcome == 'success' }}
      run: |
        rm -rf install
        phpunit -c tests/phpunit.shard.xml --testsuite Integration --log-junit logs/junit-integration.xml

    - name: Upload test reports
      if: env.RUN_TESTS == 'true' && (success() || failure())
      uses: actions/upload-artifact@v7
      with:
        name: junit-php${{ matrix.php }}-shard${{ matrix.shard }}
        retention-days: 7
        path: logs/junit-*.xml
        if-no-files-found: ignore

  tests:
    # One check over all legs: fails when a leg failed, or when the legs together did not run
    # every Integration file exactly once. On master it records the seconds each file took, which
    # the next runs balance their shards by.
    name: Tests
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.test_una == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: All legs passed
      if: needs.test.result != 'success'
      run: |
        echo "A test leg did not pass (${{ needs.test.result }})." >&2
        exit 1

    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: |
          .github
          tests

    - uses: actions/download-artifact@v7
      with:
        pattern: junit-*
        path: reports

    - name: Every Integration file ran once per PHP version
      run: |
        for php in 8.3 8.5; do
          echo "PHP $php"
          php .github/scripts/phpunit-shard.php verify reports/junit-php$php-shard*/junit-integration.xml
        done

    - name: Record timings
      if: github.event_name == 'push'
      run: php .github/scripts/phpunit-shard.php timings phpunit-timings.json reports/junit-php8.5-shard*/junit-*.xml

    - name: Save timings
      if: github.event_name == 'push'
      uses: actions/cache/save@v6
      with:
        key: phpunit-timings-${{ github.run_id }}
        path: phpunit-timings.json

  package:
    # The install package that Railway runs; built only when it will be deployed.
    name: Build package
    needs: [changes, dependencies]
    if: needs.changes.outputs.deploy_una == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/upgrade/
          !/neo/

    # WARNING: after `composer update` or `composer upgrade`, replace this commit SHA
    # with the current shivammathur/setup-php release. Every Setup PHP step must match.
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: intl, curl, gd, mbstring, zip, exif, pdo_mysql
        ini-values: short_open_tag=On, memory_limit=256M
        tools: phing

    - name: Restore dependencies
      uses: actions/cache/restore@v6
      with:
        key: ${{ needs.changes.outputs.deps_key }}
        path: ${{ env.DEPS_PATHS }}
        fail-on-cache-miss: true

    # `phing package` copies the sources and needs no installed site.
    - name: Build package
      run: |
        test -f plugins/ffmpeg/ffmpeg.exe && chmod 0755 plugins/ffmpeg/ffmpeg.exe
        phing package -Dbuild=${{ github.run_number }}

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: una-package
        path: packages/*.zip
        if-no-files-found: error

  neo-checks:
    # The jobs above don't look at neo/. `yarn lint` and `yarn typecheck` aren't clean on master
    # yet, so this fails only on errors the PR adds: both run on the PR and on its base, and
    # neo/scripts/check-new-errors.js compares them per file and rule (line numbers ignored).
    name: NEO lint and typecheck
    needs: changes
    if: needs.changes.outputs.lint_neo == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: neo

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    # yarn.lock isn't committed (see neo/AGENTS.md), so the installed tree is cached under the
    # package.json files and patches, and installed afresh every month.
    - name: Cache key
      id: keys
      run: echo "neo_deps=neo-deps-v1-$(date -u +%Y-%m)-${{ hashFiles('neo/package.json', 'neo/apps/*/package.json', 'neo/packages/*/package.json', 'neo/patches/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore NEO dependencies
      id: neo-deps
      uses: actions/cache/restore@v6
      with:
        key: ${{ steps.keys.outputs.neo_deps }}
        path: |
          neo/node_modules
          neo/apps/*/node_modules
          neo/packages/*/node_modules

    - name: Install NEO dependencies
      if: steps.neo-deps.outputs.cache-hit != 'true'
      working-directory: neo
      # The npm registry now and then answers 502 for one tarball, which no code change fixes.
      run: |
        # --ignore-scripts keeps dependencies' install scripts from running in CI. NEO's own
        # postinstall is only patch-package, so run that one explicitly: the result is the
        # same lint and typecheck output as a plain install.
        for attempt in 1 2 3; do
          if yarn install --ignore-scripts --non-interactive --network-timeout 600000; then
            yarn patch-package
            exit 0
          fi
          echo "yarn install failed (attempt $attempt of 3)"
          sleep 15
        done
        exit 1

    - name: Save NEO dependencies
      if: steps.neo-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.keys.outputs.neo_deps }}
        path: |
          neo/node_modules
          neo/apps/*/node_modules
          neo/packages/*/node_modules

    - name: Lint and typecheck the PR
      working-directory: neo
      run: |
        yarn --silent lint -f json -o "$RUNNER_TEMP/lint-head.json" || true
        node scripts/typecheck.js > "$RUNNER_TEMP/typecheck-head.txt" 2>&1 || true

    # The base's results depend only on the base commit and the installed tree, so a PR reuses
    # what an earlier PR on the same base found.
    - name: Base commit
      id: base
      run: echo "sha=$(git rev-parse "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"

    - name: Restore the base branch's results
      id: base-results
      uses: actions/cache/restore@v6
      with:
        key: neo-base-results-v1-${{ steps.base.outputs.sha }}-${{ steps.keys.outputs.neo_deps }}
        path: |
          ${{ runner.temp }}/lint-base.json
          ${{ runner.temp }}/typecheck-base.txt

    - name: Lint and typecheck the base branch
      id: base-run
      if: steps.base-results.outputs.cache-hit != 'true'
      run: |
        git worktree add --no-checkout "$RUNNER_TEMP/base" "origin/$BASE_REF"
        cd "$RUNNER_TEMP/base"
        git sparse-checkout set neo
        git checkout --quiet
        cd neo
        # Reuse the PR's install instead of a second `yarn install`.
        ln -s "$GITHUB_WORKSPACE/neo/node_modules" node_modules
        for dir in "$GITHUB_WORKSPACE"/neo/apps/*/node_modules "$GITHUB_WORKSPACE"/neo/packages/*/node_modules; do
          [ -d "$dir" ] || continue
          rel=${dir#"$GITHUB_WORKSPACE/neo/"}
          [ -d "$(dirname "$rel")" ] && [ ! -e "$rel" ] && ln -s "$dir" "$rel"
        done
        yarn --silent lint -f json -o "$RUNNER_TEMP/lint-base.json" || true
        node scripts/typecheck.js > "$RUNNER_TEMP/typecheck-base.txt" 2>&1 || true
        # Only results that look complete are kept for other PRs.
        if [ -s "$RUNNER_TEMP/lint-base.json" ] && [ -s "$RUNNER_TEMP/typecheck-base.txt" ]; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the base branch's results
      if: steps.base-run.outputs.complete == 'true'
      uses: actions/cache/save@v6
      with:
        key: neo-base-results-v1-${{ steps.base.outputs.sha }}-${{ steps.keys.outputs.neo_deps }}
        path: |
          ${{ runner.temp }}/lint-base.json
          ${{ runner.temp }}/typecheck-base.txt

    - name: Fail on new errors
      working-directory: neo
      run: >-
        node scripts/check-new-errors.js
        --lint "$RUNNER_TEMP/lint-head.json" "$RUNNER_TEMP/lint-base.json"
        --typecheck "$RUNNER_TEMP/typecheck-head.txt" "$RUNNER_TEMP/typecheck-base.txt"

  preview-env:
    name: Prepare PR environment
    needs: changes
    if: needs.changes.outputs.mode == 'pr' && (needs.changes.outputs.deploy_una == 'true' || needs.changes.outputs.deploy_neo == 'true')
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_BASE_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_TEMPLATE_ENVIRONMENT: pr-template
      RAILWAY_PR_ENVIRONMENT: pr-${{ needs.changes.outputs.pr }}
      UNA_PREVIEW_API_KEY: ${{ secrets.UNA_PREVIEW_API_KEY }}
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          scripts/railway

    - uses: ./.github/actions/railway-cli

    - name: Provision PR environment
      run: |
        if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
          echo "Set secrets RAILWAY_API_TOKEN (account token) and RAILWAY_PROJECT_ID" >&2
          exit 1
        fi
        base="${RAILWAY_BASE_ENVIRONMENT:-production}"
        template="${RAILWAY_TEMPLATE_ENVIRONMENT:-pr-template}"
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$base" --json

        # Railway services are project-scoped: mariadb, una and neo already exist, so `railway add`
        # cannot create them again and a plain new environment holds no instances of them
        # (every preview after the first failed this way). A PR environment therefore gets
        # its instances by duplicating the template environment. An environment left over
        # from a failed run has no una instance; recreate it.
        if ! railway service status --service una --environment "$RAILWAY_PR_ENVIRONMENT" >/dev/null 2>&1; then
          railway environment delete "$RAILWAY_PR_ENVIRONMENT" -y >/dev/null 2>&1 || true
          railway environment new "$RAILWAY_PR_ENVIRONMENT" --duplicate "$template" --json
          # a duplicate may carry the template's deployments; the builds below replace them
          railway down --service una --environment "$RAILWAY_PR_ENVIRONMENT" -y >/dev/null 2>&1 || true
          railway down --service neo --environment "$RAILWAY_PR_ENVIRONMENT" -y >/dev/null 2>&1 || true
        fi
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PR_ENVIRONMENT" --json
        # An environment duplicated before the neo service existed lacks it.
        scripts/railway/neo.sh instance "$RAILWAY_PR_ENVIRONMENT"

        # The duplicated una instance is what `railway up` deploys into. Setting its variables
        # doubles as the readiness check: it fails with "ServiceInstance not found" until it exists.
        for i in $(seq 1 12); do
          railway variable set --service una --environment "$RAILWAY_PR_ENVIRONMENT" --skip-deploys \
            MYSQLHOST=mariadb.railway.internal \
            MYSQLPORT=3306 \
            MYSQLDATABASE=una \
            MYSQLUSER=una \
            MYSQLPASSWORD=una \
            UNA_DEMO_SEED=1 \
            ${UNA_PREVIEW_API_KEY:+UNA_API_KEY="$UNA_PREVIEW_API_KEY"} \
            && break
          sleep 5
        done
        # Previews live on their Railway domains (<service>-pr-<n>.up.railway.app), which share
        # Railway's wildcard certificate. Custom pr-<n> / api-pr-<n> hosts on unacms.app needed two
        # Let's Encrypt certificates per PR, and a busy week ran into Let's Encrypt's rate limit
        # (PR #5934 got none). UNA_AUTO_HOSTNAME makes UNA build its URLs from its host.
        railway domain --service una --environment "$RAILWAY_PR_ENVIRONMENT" || true
        railway domain --service neo --environment "$RAILWAY_PR_ENVIRONMENT" || true
        service_host() {
          railway domain list --service "$1" --environment "$RAILWAY_PR_ENVIRONMENT" --json | jq -r '.domains[] | select(.type == "service") | .domain' | head -n1
        }
        una_host=$(service_host una)
        neo_host=$(service_host neo)
        [ -n "$una_host" ] || { echo "No Railway domain for una" >&2; exit 1; }
        [ -n "$neo_host" ] || { echo "No Railway domain for neo" >&2; exit 1; }
        una_url="https://${una_host#https://}"
        neo_url="https://${neo_host#https://}"
        railway variable set --service una --environment "$RAILWAY_PR_ENVIRONMENT" --skip-deploys UNA_CLIENT_URL="$neo_url"
        scripts/railway/neo.sh vars "$RAILWAY_PR_ENVIRONMENT" "$una_url" "$neo_url"

  deploy:
    name: Deploy PR to Railway (una)
    needs: [changes, test, package, preview-env]
    # A neo-only PR runs no PHPUnit (test is skipped) but still gets UNA on its first preview.
    if: >-
      !cancelled() && needs.changes.outputs.mode == 'pr' && needs.changes.outputs.deploy_una == 'true'
      && needs.package.result == 'success' && needs.preview-env.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_PR_ENVIRONMENT: pr-${{ needs.changes.outputs.pr }}
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          scripts/railway

    - uses: actions/download-artifact@v7
      with:
        name: una-package
        path: packages

    - name: Prepare artefact
      run: scripts/railway/stage-una.sh packages deploy

    - uses: ./.github/actions/railway-cli

    - name: Deploy artefact
      run: railway up ./deploy --path-as-root --no-gitignore --verbose --ci --service una --environment "$RAILWAY_PR_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

  deploy-neo:
    # NEO isn't covered by `test`, so it builds alongside it.
    name: Deploy PR to Railway (neo)
    needs: [changes, preview-env]
    if: needs.changes.outputs.mode == 'pr' && needs.changes.outputs.deploy_neo == 'true'
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_PR_ENVIRONMENT: pr-${{ needs.changes.outputs.pr }}
    steps:
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: |
          .github/actions
          scripts/railway
          neo

    - uses: ./.github/actions/railway-cli

    - name: Deploy NEO
      run: |
        scripts/railway/neo.sh stage /tmp/deploy-neo
        railway up /tmp/deploy-neo --path-as-root --no-gitignore --verbose --ci --service neo --environment "$RAILWAY_PR_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

  preview-comment:
    name: Comment preview URLs
    needs: [changes, preview-env, deploy, deploy-neo]
    if: ${{ !cancelled() && needs.preview-env.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_PR_ENVIRONMENT: pr-${{ needs.changes.outputs.pr }}
      UNA_RESULT: ${{ needs.deploy.result }}
      NEO_RESULT: ${{ needs.deploy-neo.result }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.changes.outputs.pr }}
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: .github/actions

    - uses: ./.github/actions/railway-cli

    - name: Comment preview URLs on PR
      run: |
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PR_ENVIRONMENT" --json >/dev/null
        service_url() {
          local host
          host=$(railway domain list --service "$1" --environment "$RAILWAY_PR_ENVIRONMENT" --json | jq -r '.domains[] | select(.type == "service") | .domain' | head -n1)
          [ -n "$host" ] && echo "https://${host#https://}"
        }
        una_url=$(service_url una || true)
        neo_url=$(service_url neo || true)
        state() {
          case "$1" in
            success) echo "" ;;
            skipped) echo ", unchanged by this push" ;;
            *) echo " (deploy: $1)" ;;
          esac
        }

        marker="<!-- railway-preview -->"
        body=$(printf '%s\n**Preview**: %s (NEO web client%s)\n**API**: %s (UNA%s)\n\nRailway environment: `%s`. A fresh UNA install takes about 10 minutes. Remove the `preview` label to delete the environment.' \
          "$marker" "$neo_url" "$(state "$NEO_RESULT")" "$una_url" "$(state "$UNA_RESULT")" "$RAILWAY_PR_ENVIRONMENT")

        comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
          | head -n1)

        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body"
        else
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
        fi

  deploy-production:
    # Runs next to the Jenkins deploy to ci.una.io, which is unchanged.
    name: Deploy master to Railway (api.unacms.app)
    needs: [changes, test, package]
    if: >-
      !cancelled() && needs.changes.outputs.mode == 'production' && needs.changes.outputs.deploy_una == 'true'
      && needs.test.result == 'success' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://api.unacms.app
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: production
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: yasko
      UNA_API_KEY: ${{ secrets.UNA_API_KEY }}
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github/actions
          scripts/railway

    - uses: actions/download-artifact@v7
      with:
        name: una-package
        path: packages

    - name: Prepare artefact
      run: scripts/railway/stage-una.sh packages deploy

    - uses: ./.github/actions/railway-cli

    - name: Configure production
      run: |
        if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
          echo "Set secrets RAILWAY_API_TOKEN (account token) and RAILWAY_PROJECT_ID" >&2
          exit 1
        fi
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json
        # Database credentials and UNA_HASH_SECRET live in the Railway environment, not here.
        railway variable set --service una --environment "$RAILWAY_ENVIRONMENT" --skip-deploys \
          UNA_CLIENT_URL=https://unacms.app \
          ${UNA_API_KEY:+UNA_API_KEY="$UNA_API_KEY"}

    - name: Deploy artefact
      run: railway up ./deploy --path-as-root --no-gitignore --verbose --ci --service una --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

    - name: api.unacms.app DNS
      if: env.VERCEL_TOKEN != ''
      run: scripts/railway/domains.sh railway-domain api.unacms.app "$RAILWAY_ENVIRONMENT" una

    - name: Smoke test
      # A fresh production install takes about 4 minutes; allow 10.
      run: |
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.unacms.app/ || true)
          [ "$code" = "200" ] && { echo "api.unacms.app is up"; exit 0; }
          # Until the certificate is issued, check the Railway hostname instead.
          host=$(railway domain list --service una --environment "$RAILWAY_ENVIRONMENT" --json | jq -r '.domains[] | select(.type == "service") | .domain' | head -n1)
          if [ -n "$host" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://${host#https://}/" || true)" = "200" ]; then
            echo "up at https://$host (api.unacms.app answered $code; certificate may still be pending)"
            exit 0
          fi
          sleep 10
        done
        echo "UNA did not come up" >&2
        exit 1

  deploy-production-neo:
    # The NEO web client for unacms.app. NEO_PRODUCTION_HOST (a repository variable) is the
    # public host; until it is set, the client is only on its Railway domain.
    name: Deploy master to Railway (neo)
    needs: changes
    if: needs.changes.outputs.mode == 'production' && needs.changes.outputs.deploy_neo == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production-neo
      cancel-in-progress: false
    environment:
      name: production-neo
      url: ${{ steps.urls.outputs.app_url }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: production
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: yasko
      NEO_PRODUCTION_HOST: ${{ vars.NEO_PRODUCTION_HOST }}
    steps:
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: |
          .github/actions
          scripts/railway
          neo

    - uses: ./.github/actions/railway-cli

    - name: Configure neo
      id: urls
      run: |
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json
        railway domain --service neo --environment "$RAILWAY_ENVIRONMENT" || true
        neo_host=$(railway domain list --service neo --environment "$RAILWAY_ENVIRONMENT" --json | jq -r '.domains[] | select(.type == "service") | .domain' | head -n1)
        neo_host=${neo_host#https://}
        [ -n "$neo_host" ] || { echo "No Railway domain for neo" >&2; exit 1; }
        app_url="https://${NEO_PRODUCTION_HOST:-$neo_host}"
        scripts/railway/neo.sh vars "$RAILWAY_ENVIRONMENT" https://api.unacms.app "$app_url"
        echo "app_url=$app_url" >> "$GITHUB_OUTPUT"
        echo "neo_url=https://$neo_host" >> "$GITHUB_OUTPUT"

    - name: Deploy NEO
      run: |
        scripts/railway/neo.sh stage /tmp/deploy-neo
        railway up /tmp/deploy-neo --path-as-root --no-gitignore --verbose --ci --service neo --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

    - name: Production host DNS
      if: env.NEO_PRODUCTION_HOST != '' && env.VERCEL_TOKEN != ''
      run: scripts/railway/domains.sh railway-domain "$NEO_PRODUCTION_HOST" "$RAILWAY_ENVIRONMENT" neo

    - name: Smoke test
      env:
        NEO_URL: ${{ steps.urls.outputs.neo_url }}
      run: |
        for i in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w '%{http_code}' "$NEO_URL/" || true)
          [ "$code" = "200" ] && { echo "NEO is up at $NEO_URL"; exit 0; }
          sleep 10
        done
        echo "NEO did not answer 200 at $NEO_URL (last: $code)" >&2
        exit 1

name: UNA CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: una
          MYSQL_USER: una
          MYSQL_PASSWORD: una
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: intl, curl, gd, mbstring, zip, exif, pdo_mysql
        ini-values: short_open_tag=On, memory_limit=256M
        tools: composer, phing, phpunit:12

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: yarn

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-dev

    - name: Install JS dependencies
      run: yarn install --frozen-lockfile

    - name: Prepare writable paths
      run: |
        mkdir -p cache cache_public logs tmp storage
        chmod a+rwX inc cache cache_public logs tmp storage
        test -f plugins/ffmpeg/ffmpeg.exe && chmod 0755 plugins/ffmpeg/ffmpeg.exe

    - name: Install UNA
      working-directory: install
      run: >
        php cmd.php
        -m bx_antispam
        --db_host=127.0.0.1
        --db_name=una
        --db_user=una
        --db_password=una
        --server_http_host=localhost
        --server_php_self=/install/index.php

    - name: Run PHPUnit
      run: phpunit -c tests/phpunit.xml

    - name: Build package
      run: phing package -Dbuild=${{ github.run_number }}

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: una-package
        path: packages/*.zip
        if-no-files-found: error

  deploy:
    name: Deploy PR to Railway
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_BASE_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_PR_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: una-package
        path: packages

    - name: Prepare artefact
      run: |
        mkdir -p deploy
        unzip -q packages/*.zip -d /tmp/una-pkg
        pkg_dir=$(find /tmp/una-pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)
        cp -a "$pkg_dir"/. deploy/
        cp scripts/railway/Dockerfile scripts/railway/entrypoint.sh scripts/railway/railway.toml deploy/
        chmod +x deploy/entrypoint.sh

    - name: Install Railway CLI
      run: |
        curl -fsSL https://railway.com/install.sh | sh
        echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

    - name: Provision PR environment
      run: |
        if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
          echo "Set secrets RAILWAY_API_TOKEN (account token) and RAILWAY_PROJECT_ID" >&2
          exit 1
        fi
        base="${RAILWAY_BASE_ENVIRONMENT:-production}"
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$base" --json
        railway environment new "$RAILWAY_PR_ENVIRONMENT" || true
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PR_ENVIRONMENT" --json
        railway add --image mariadb:11 --service mariadb --json \
          --variables MARIADB_ROOT_PASSWORD=una \
          --variables MARIADB_DATABASE=una \
          --variables MARIADB_USER=una \
          --variables MARIADB_PASSWORD=una \
          || true
        railway add --service una --json || true
        railway variable set --service una --environment "$RAILWAY_PR_ENVIRONMENT" --skip-deploys \
          MYSQLHOST=mariadb.railway.internal \
          MYSQLPORT=3306 \
          MYSQLDATABASE=una \
          MYSQLUSER=una \
          MYSQLPASSWORD=una \
          || true
        railway domain --service una --environment "$RAILWAY_PR_ENVIRONMENT" || true

    - name: Deploy artefact
      run: railway up ./deploy --path-as-root --no-gitignore --ci --service una --environment "$RAILWAY_PR_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

  teardown:
    name: Remove PR Railway environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_BASE_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_PR_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
    steps:
    - name: Install Railway CLI
      run: |
        curl -fsSL https://railway.com/install.sh | sh
        echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

    - name: Delete PR environment
      run: |
        if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
          echo "Set secrets RAILWAY_API_TOKEN (account token) and RAILWAY_PROJECT_ID" >&2
          exit 1
        fi
        base="${RAILWAY_BASE_ENVIRONMENT:-production}"
        railway link --project "$RAILWAY_PROJECT_ID" --environment "$base" --json
        railway environment delete "$RAILWAY_PR_ENVIRONMENT" -y || true

name: Install Railway CLI
description: Pinned Railway CLI release, checked against its published SHA-256 before it is run.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RAILWAY_CLI_VERSION: v5.71.0
        RAILWAY_CLI_SHA256: 2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9
      run: |
        asset="railway-${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        gh release download "$RAILWAY_CLI_VERSION" --repo railwayapp/cli --pattern "$asset" --dir /tmp/railway-cli
        echo "${RAILWAY_CLI_SHA256}  /tmp/railway-cli/${asset}" | sha256sum -c -
        tar -xzf "/tmp/railway-cli/${asset}" -C /tmp/railway-cli railway
        sudo install -m 0755 /tmp/railway-cli/railway /usr/local/bin/railway
        railway --version

; Loaded after the image's www.conf, which caps the pool at 5 workers.
; image_transcoder.php keeps its worker while it downloads the original file
; through the site URL, and that download needs a second worker. With 5 workers,
; 5 parallel thumbnail requests took them all and hung until nginx returned 504.
[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

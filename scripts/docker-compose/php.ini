memory_limit=192M
upload_max_filesize=200M
post_max_size=200M
max_input_vars = 5000
variables_order=GPCSE
sendmail_path = "/usr/sbin/sendmail --host=mailpit --port=1025 -t -i"

; No X-Powered-By header with the PHP version in responses.
expose_php = Off

; Errors always go to the container log (docker compose logs php). They are printed
; in pages only when PHP_DISPLAY_ERRORS=1 (see docker-compose.yml): pages show file
; paths and stack traces to every visitor.
log_errors = On
error_log =
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_ERRORS}
html_errors = On
error_prepend_string = "<pre style='white-space: pre-line'>"
error_append_string = "</pre>"

[opcache]
opcache.enable=1
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.max_accelerated_files=100000
opcache.memory_consumption=256
opcache.max_wasted_percentage=20
opcache.interned_strings_buffer=32
opcache.fast_shutdown=1

[xdebug]
; Off unless XDEBUG_MODE=debug is set for the php service (see docker-compose.yml).
; Then a request with the XDEBUG_TRIGGER cookie or query parameter starts a session.
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal

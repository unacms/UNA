; php.ini of the cron container (mounted as /usr/local/etc/php/php.ini).
memory_limit=-1
upload_max_filesize=200M
post_max_size=200M
max_input_vars = 5000
variables_order=GPCSE
sendmail_path = "/usr/sbin/sendmail --host=mailpit --port=1025 -t -i"

; Errors are printed once, to the cron output (una-cron.sh writes it to /var/log/unacron.log).
log_errors = Off
display_errors = stderr
html_errors = Off

[opcache]
opcache.enable=1
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.max_accelerated_files=100000
opcache.memory_consumption=72
opcache.max_wasted_percentage=20
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1

# Template: the nginx image writes it to /etc/nginx/conf.d/default.conf at start,
# replacing ${UNA_PORT} with the port from docker-compose.yml.

# No nginx version in the Server header and error pages.
server_tokens off;

# Files whose URL changes when they do (compiled bundles in cache_public/, files linked
# with ?rev=<revision>) are cached for a year; other static files for 30 days.
map $request_uri $una_static_expires {
    ~*/cache_public/[^/?]+          1y;
    ~*[?&]rev=[0-9]+(&|$)           1y;
    default                         30d;
}
map $request_uri $una_static_cache_control {
    ~*/cache_public/[^/?]+          "public, immutable";
    ~*[?&]rev=[0-9]+(&|$)           "public, immutable";
    default                         "public";
}

server {
    # The same port inside and outside the container: php and cron forward
    # localhost:${UNA_PORT} here (self-url.sh), so the site URL works from PHP too.
    listen ${UNA_PORT} default_server;
    root /opt/una;
    client_max_body_size 200M;

    # Compress text responses. HTML is compressed whenever gzip is on; the
    # types below add CSS/JS/JSON/SVG. Already-compressed responses (the
    # gzip_loader.php bundles, which set Content-Encoding themselves, and
    # woff2 fonts) are left untouched by nginx.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json application/wasm;

    # Folders that Apache closes with "Deny from all" in their .htaccess: files,
    # logs, caches, code that only PHP reads (storage.php serves the files) and the
    # developer samples, which print warnings and server paths.
    # Regex locations match in order, so these come before the ones below.
    location ~* ^/(storage|logs|tmp|cache|plugins|periodic|samples|template/scripts|modules/boonex/files/data)/ {
        return 404;
    }
    location ~* ^/inc/(?!js/) {
        return 404;
    }

    # The favicon uploaded in Designer, else the default one (favicon.php).
    location = /favicon.ico {
        rewrite ^ /favicon.php last;
    }

    location / {
        index index.html index.htm index.php;
        rewrite "^/api/v2(/(.*))?$" /api_v2.php?_q=$2 last;
        rewrite "^/api/mcp/?$" /api_mcp.php last;
        rewrite "^/\.well-known/oauth-protected-resource(/.*)?$" /api_mcp.php?_wk=protected-resource last;
        rewrite "^/\.well-known/oauth-authorization-server(/.*)?$" /api_mcp.php?_wk=authorization-server last;
        rewrite "^/page/(.*)$" /page.php?i=$1 last;
        rewrite "^/m/(.*)$" /modules/index.php?r=$1 last;
        rewrite "^/s/([a-zA-Z0-9_]+)/([a-zA-Z0-9\.]+)" /storage.php?o=$1&f=$2 last;
        if (!-e $request_filename) {
            rewrite  ^/(.+)$  /r.php?_q=$1  last;
            break;
        }
    }

    # Long-lived caching for real static files. Virtual paths that merely end
    # in an asset extension (/s/<obj>/<file>.png served by storage.php, or a
    # missing file routed through r.php) are not files on disk, so try_files
    # hands them to @dynamic instead of 404ing.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|css|js|mjs|map)$ {
        try_files $uri @dynamic;
        expires $una_static_expires;
        add_header Cache-Control $una_static_cache_control;
        access_log off;
    }

    location @dynamic {
        rewrite "^/s/([a-zA-Z0-9_]+)/([a-zA-Z0-9\.]+)" /storage.php?o=$1&f=$2 last;
        rewrite ^/(.+)$ /r.php?_q=$1 last;
    }

    index index.php index.html index.htm;
    location ~ \.php$ {
        # Resolved per request, so a recreated php container is found without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $una_php php:9000;
        fastcgi_pass $una_php;
        # The web installer and some Studio actions run for minutes.
        fastcgi_read_timeout 600s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

<!-- The search window's body (BxBaseSearchWindow::getBody): the field, the chips under it, the results with their count, sort and tabs, and the full results link. The same in the popup and on the results page. -->
<div class="bx-search-window __class__ flex flex-col min-h-0" data-mode="__mode__" data-url="__content_url__" data-ai="__ai__" data-query="__query__">
    <form class="bx-search-window-form flex items-center gap-3 px-4 py-3 border-b border-gray-200 dark:border-gray-700" action="__form_url__" method="get" role="search">
        __icon_search__
        <input type="search" name="keyword" value="__keyword__" class="bx-search-window-input flex-1 min-w-0 bg-transparent border-0 p-0 text-lg text-gray-900 dark:text-gray-100 placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:ring-0 focus:outline-none" placeholder="__placeholder__" aria-label="__label__" autocomplete="off" spellcheck="false" />
        <span class="bx-search-window-busy hidden size-4 shrink-0 rounded-full border-2 border-gray-300 dark:border-gray-600 border-t-blue-600 dark:border-t-blue-400 animate-spin" aria-hidden="true"></span>
        <bx_if:close><button type="button" class="bx-search-window-close bx-btn bx-btn-small bx-btn-icon shrink-0" aria-label="<bx_text_attribute:_sys_close />"><bx_image_auto:x /></button></bx_if:close>
    </form>
    <div class="bx-search-window-chips-wrap px-4 pt-3">__chips__</div>
    <div class="bx-search-window-status sr-only" role="status" aria-live="polite"></div>
    <div class="bx-search-window-results flex-1 min-h-0 [@media(min-height:36rem)]:min-h-40 overflow-y-auto px-4 pb-3">__results__</div>
    <div class="bx-search-window-footer flex items-center justify-between gap-3 px-4 py-3 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-600 dark:text-gray-400">
        <span class="bx-search-window-keys hidden md:inline"><bx_text:_sys_search_window_keys /></span>
        <a class="bx-search-window-full bx-btn bx-btn-small ms-auto" href="__results_url__"><bx_text:_sys_search_window_full /></a>
    </div>
</div>

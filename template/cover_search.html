<!-- A section's or context's Search (BxBasePage::getSearchAction): opens the search window with the page's scope. Glass and small as the
     section's Add beside it, a pill with the label from lg, round and icon-only below. -->
<button type="button" class="bx-cover-search bx-btn bx-btn-glass bx-btn-small bx-btn-icon-mobile shrink-0 __class__" __data__ onclick="return BxDolSearchWindow.openFrom(this);" aria-haspopup="dialog" aria-expanded="false" aria-controls="bx-search-window" title="__title__" aria-label="__title__">__icon__<span class="bx-btn-icon-mobile-label">__label__</span></button>

<!-- The AI search block on the site (BxBaseServicesSearch::_getBlockSearchAiSite): a field for a query in words, the chips it is read into, and Search, which opens the results block of the search object with them as filters. -->
<div id="__id__" class="bx-search-ai">
    <form class="bx-search-ai-form flex items-start gap-2" role="search" method="get" action="">
        <bx_if:multiline>
            <div class="bx-form-input-wrapper bx-form-input-wrapper-textarea flex-1 min-w-0">
                <textarea id="__id__-input" name="ai_query" rows="2" class="bx-def-font-inputs bx-form-input-textarea bx-search-ai-input" placeholder="__placeholder__" aria-label="__placeholder__" autocomplete="off">__query__</textarea>
            </div>
        </bx_if:multiline>
        <bx_if:line>
            <div class="bx-form-input-wrapper bx-form-input-wrapper-text flex-1 min-w-0">
                <input id="__id__-input" type="search" name="ai_query" value="__query__" class="bx-def-font-inputs bx-form-input-text bx-search-ai-input" placeholder="__placeholder__" aria-label="__placeholder__" autocomplete="off" />
            </div>
        </bx_if:line>
        <button type="submit" class="bx-btn bx-btn-primary bx-search-ai-submit shrink-0">__txt_search__</button>
    </form>
    <div class="bx-search-ai-chips flex flex-wrap items-center gap-2" role="status" aria-live="polite"></div>
</div>
<script type="application/json" id="__id__-cfg">__config__</script>
<script>
$(document).ready(function () {
    var eCfg = document.getElementById('__id__-cfg');
    if (eCfg && typeof BxDolSearchAi === 'function')
        new BxDolSearchAi(JSON.parse(eCfg.textContent));
});
</script>

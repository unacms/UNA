<div class="sys-api-token-created bx-def-padding">
    <div class="bx-def-margin-bottom">__txt_once__</div>
    <label for="sys-api-token-created-token" class="block bx-def-font-grayed bx-def-margin-sec-bottom">__txt_token__</label>
    <div class="flex items-center gap-2 bx-def-margin-bottom">
        <input type="text" id="sys-api-token-created-token" class="bx-def-font-inputs bx-form-input-text flex-1" readonly="readonly" value="__token__" onclick="this.select()" />
        <button type="button" class="bx-btn bx-btn-small" onclick="var o = $(this).prev('input'); o.select(); if (navigator.clipboard) navigator.clipboard.writeText(o.val());">__txt_copy__</button>
    </div>
    <label for="sys-api-token-created-url" class="block bx-def-font-grayed bx-def-margin-sec-bottom">__txt_mcp_url__</label>
    <div class="flex items-center gap-2 bx-def-margin-bottom">
        <input type="text" id="sys-api-token-created-url" class="bx-def-font-inputs bx-form-input-text flex-1" readonly="readonly" value="__mcp_url__" onclick="this.select()" />
        <button type="button" class="bx-btn bx-btn-small" onclick="var o = $(this).prev('input'); o.select(); if (navigator.clipboard) navigator.clipboard.writeText(o.val());">__txt_copy__</button>
    </div>
    <div class="bx-def-font-grayed">__txt_header__</div>
</div>

<div id="__id_wrap__" class="bx-grid-ag-wrap">
    <bx_if:display_header>
        <div class="bx-grid-header__class__">
            <div class="bx-grid-header-cnt bx-def-padding-sec-bottom">
                <bx_if:filter>
                    <div class="bx-grid-header-controls-filter">
                        __controls__
                    </div>
                </bx_if:filter>
                <bx_if:counter>
                    <div class="bx-grid-header-controls-counter bx-def-margin-thd-leftright">
                        <span class="bx-grid-header-controls-counter-value">__counter__</span>
                    </div>
                </bx_if:counter>
                <bx_if:actions_independent>
                    <div class="bx-grid-header-controls-independent">
                        __actions_independent__
                    </div>
                </bx_if:actions_independent>
            </div>
        </div>
    </bx_if:display_header>
    <div id="__id_cont__" class="bx-grid-ag-host">
        <div id="__id_table__" class="bx-grid-ag-selection" hidden></div>
        <div id="__id_grid__" class="bx-grid-ag ag-theme-quartz"></div>
    </div>
    <bx_if:display_footer>
        <div class="bx-grid-footer">
            <hr class="bx-def-hr" />
            <div class="bx-grid-footer-cnt bx-def-padding-sec-top bx-def-margin-thd-neg bx-clearfix">
                <bx_if:actions_bulk>
                    <div style="float:left;">
                        __actions_bulk__
                    </div>
                </bx_if:actions_bulk>
                <bx_if:reorder>
                    <div class="bx-grid-ag-pager bx-def-margin-thd" style="float:right; display:none;">
                        <button type="button" class="bx-btn bx-btn-small bx-grid-ag-prev">__paginate_prev__</button>
                        <span class="bx-grid-ag-page"></span>
                        <button type="button" class="bx-btn bx-btn-small bx-grid-ag-next">__paginate_next__</button>
                    </div>
                </bx_if:reorder>
            </div>
        </div>
    </bx_if:display_footer>
</div>
<script type="application/json" id="bx-grid-ag-cfg-__object__">__config__</script>
<script>
$(document).ready(function () {
    var eCfg = document.getElementById('bx-grid-ag-cfg-__object__');
    if (!eCfg || typeof BxDolGridAg !== 'function')
        return;

    var oCfg = JSON.parse(eCfg.textContent);
    if (typeof glGrids === 'undefined')
        glGrids = {};

    if (undefined == glGrids[oCfg.object])
        glGrids[oCfg.object] = new BxDolGrid(oCfg.object, oCfg.bx);
    else
        glGrids[oCfg.object].init({
            start: oCfg.bx.start,
            per_page: oCfg.bx.per_page,
            filter: oCfg.bx.filter,
            query_append: oCfg.bx.query_append
        });

    new BxDolGridAg(oCfg, glGrids[oCfg.object]);
});
</script>

<div id="__id__" class="bx-popup-wrapper bx-popup-box-wrapper box-border" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="__id___title">
    <div class="bx-popup-gap mx-4 my-px">
        <div class="bx-popup bx-popup-box bx-popup-width bx-popup-border bx-popup-color-bg">
            <!-- A block's header (its padding and title); Close is a small (36px) round button, as the header's toolbar buttons -->
            <div class="bx-popup-header flex items-center justify-between gap-3 px-3 md:px-4 pt-2 md:pt-3">
                <div class="bx-db-title min-w-0 truncate" id="__id___title">__title__</div>
                <div class="bx-popup-close-wrapper relative shrink-0 -my-1">
                    <button type="button" aria-label="<bx_text_attribute:_sys_close />" class="bx-popup-element-close flex items-center justify-center w-9 h-9 rounded-full text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 dark:bg-gray-700/50 dark:hover:bg-gray-700 dark:active:bg-gray-600">
                        <span class="bx-icon bx-icon-close flex" aria-hidden="true">
                            <bx_image_auto:times />
                        </span>
                    </button>
                </div>
            </div>
            <div class="bx-popup-content p-4">__content__</div>
            <div class="bx-focus-trap w-0 h-0 outline-none" tabindex="0"></div>
        </div>
    </div>
</div>

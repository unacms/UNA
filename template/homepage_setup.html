<div class="bx-def-page-width mx-auto px-4 pt-4 lg:pt-6 box-border">
    <section id="bx-setup" class="bx-setup bx-def-color-bg-block bx-def-border bx-def-border-radius-block bx-content-padding-block" aria-labelledby="bx-setup-title">
        <div class="bx-setup-head">
            <div class="bx-setup-heading">
                <h2 id="bx-setup-title" class="bx-setup-title"><bx_text:_sys_setup_title /></h2>
                <p class="bx-setup-progress bx-def-font-grayed">__progress__</p>
            </div>
            <button type="button" class="bx-setup-dismiss" title="<bx_text_attribute:_sys_setup_dismiss />" aria-label="<bx_text_attribute:_sys_setup_dismiss />" onclick="bx_setup_dismiss(this)">__icon_close__</button>
        </div>
        <ol class="bx-setup-steps">
            <bx_repeat:steps>
                <li class="bx-setup-step __class__">
                    <span class="bx-setup-step-icon" aria-hidden="true">__icon__</span>
                    <div class="bx-setup-step-body">
                        <div class="bx-setup-step-title">__title__<span class="sr-only">__state__</span></div>
                        <p class="bx-setup-step-text bx-def-font-grayed">__text__</p>
                    </div>
                    <bx_if:action>
                        <a class="bx-setup-step-action bx-btn bx-btn-small__primary__" href="__url__" data-step="__name__" onclick="return bx_setup_step(this)">__action__</a>
                    </bx_if:action>
                </li>
            </bx_repeat:steps>
        </ol>
        <p class="bx-setup-join">
            <span class="bx-setup-step-icon" aria-hidden="true">__icon_join__</span>
            <span class="bx-setup-join-text">__join__</span>
            <a class="bx-setup-step-action bx-btn bx-btn-small" href="__join_url__" aria-label="__join_action_label__"><bx_text:_sys_setup_join_action /></a>
        </p>
    </section>
</div>

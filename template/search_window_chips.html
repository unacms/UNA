<!-- The chips on the left, the sort on the right of the same row; the row wraps on phones. -->
<div class="bx-search-window-chips-row flex flex-wrap items-center gap-2">
    <div class="bx-search-window-chips flex flex-wrap items-center gap-2" role="group" aria-label="__label__">__chips__</div>
    <bx_if:sort>
        <label class="ms-auto flex items-center"><span class="sr-only">__sort_label__</span>
            <select class="bx-search-window-sort bx-form-input-select bx-form-input-small w-auto">
                <option value="best" __sort_best_selected__>__sort_best__</option>
                <option value="new" __sort_new_selected__>__sort_new__</option>
            </select>
        </label>
    </bx_if:sort>
</div>
<div class="bx-search-window-panels">__panels__</div>

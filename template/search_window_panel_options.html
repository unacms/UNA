<fieldset id="__id__" class="bx-search-window-panel bx-search-window-dropdown hidden" data-name="__name__">
    <legend class="sr-only">__label__</legend>
    <div class="flex flex-col gap-1 p-2">
        <bx_repeat:options><label class="flex h-9 items-center gap-2 text-sm text-gray-800 dark:text-gray-200"><input type="__type__" name="bx_search_window___name__" value="__value__" __checked__ />__title__</label></bx_repeat:options>
    </div>
    <div class="px-2 pb-2 flex justify-end"><button type="button" class="bx-search-window-options-apply bx-btn bx-btn-small bx-btn-primary">__apply__</button></div>
</fieldset>

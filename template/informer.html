<div class="bx-def-page-width mx-auto px-3 md:px-4 lg:px-6 pt-3 md:pt-4 lg:pt-6 box-border">
    <div id="bx-informer" class="space-y-3" aria-live="polite">
        <bx_repeat:messages>
            <div id="__id__" class="bx-informer-msg __class__" role="status">
                <div class="bx-informer-indicator" aria-hidden="true">
                    <span class="bx-informer-icon bx-informer-icon-info"><i class="sys-icon info-circle"></i></span>
                    <span class="bx-informer-icon bx-informer-icon-plus"><i class="sys-icon plus"></i></span>
                    <span class="bx-informer-icon bx-informer-icon-alert"><i class="sys-icon exclamation-triangle"></i></span>
                    <span class="bx-informer-icon bx-informer-icon-error"><i class="sys-icon times-circle"></i></span>
                </div>
                <div class="bx-informer-content">__msg__</div>
                <bx_if:action>
                    <a class="bx-informer-action" href="__action_url__">__action_title__</a>
                </bx_if:action>
            </div>
        </bx_repeat:messages>
    </div>
</div>

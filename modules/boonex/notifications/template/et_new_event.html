<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
    <tr>
        <td width="48" valign="top" style="width: 48px; padding: 0 12px 0 0; vertical-align: top;">
            <bx_if:show_icon_image><img src="__icon_url__" width="48" height="48" alt="" style="display: block; width: 48px; height: 48px; border: 0; border-radius: 50%;" /></bx_if:show_icon_image>
            <bx_if:show_icon_letter>__icon_letter__</bx_if:show_icon_letter>
        </td>
        <td valign="middle" class="bx-email-title" style="vertical-align: middle; text-align: left; font: 400 16px/22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.048px; color: #14171e; word-break: break-word;">
            __content__
            <div class="bx-email-muted" style="margin: 2px 0 0 0; font: 400 14px/20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #7b7d81;">__date__</div>
        </td>
    </tr>
</table>
<bx_if:show_summary>
    <div style="margin: 20px 0 0 0; text-align: left;">__summary__</div>
</bx_if:show_summary>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 24px 0 0 0;">
    <tr>
        <td align="center" bgcolor="#14171e" style="background-color: #14171e; border-radius: 8px;">
            <a href="__content_url__" target="_blank" class="bx-email-btn" style="display: inline-block; background-color: #14171e; color: #ffffff; text-decoration: none; font: 400 16px/24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 8px; padding: 12px 24px;">__button__</a>
        </td>
    </tr>
</table>

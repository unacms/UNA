__tabs__
<div class="bx-analytics-panel" __panel_attrs__>
    <bx_if:rows>
        <div class="bx-analytics-table-wrap" role="region" aria-label="__caption__" tabindex="0">
            <table class="bx-analytics-table">
                <thead>
                    <tr>
                        <bx_repeat:columns>
                            <th scope="col" class="bx-analytics-col-__type__" __sort__>__title__</th>
                        </bx_repeat:columns>
                    </tr>
                </thead>
                <tbody>
                    <bx_repeat:rows>
                        <tr>
                            <bx_repeat:cells>
                                <td class="bx-analytics-col-__type__">
                                    <bx_if:label>
                                        <div class="bx-analytics-cell-label">
                                            <span class="bx-analytics-row-bar" style="width: __bar__%" aria-hidden="true"></span>
                                            <bx_if:filter>
                                                <button type="button" class="bx-analytics-cell-btn" data-bx-analytics-filter="__filter_dim__" data-bx-analytics-value="__filter_value__" title="__filter_title__">__label__</button>
                                            </bx_if:filter>
                                            <bx_if:link>
                                                <a class="bx-analytics-cell-link" href="__link_href__">__label__</a>
                                            </bx_if:link>
                                            <bx_if:open>
                                                <button type="button" class="bx-analytics-cell-btn" data-bx-analytics-open="__open_param__" data-bx-analytics-value="__open_value__">__label__</button>
                                            </bx_if:open>
                                            <bx_if:text>
                                                <span class="bx-analytics-cell-text">__label__</span>
                                            </bx_if:text>
                                            <bx_if:sub>
                                                <span class="bx-analytics-cell-sub">__sub__</span>
                                            </bx_if:sub>
                                        </div>
                                    </bx_if:label>
                                    <bx_if:value>__cell_value__</bx_if:value>
                                </td>
                            </bx_repeat:cells>
                        </tr>
                    </bx_repeat:rows>
                </tbody>
            </table>
        </div>
    </bx_if:rows>
    <bx_if:empty>
        <div class="bx-analytics-empty">__empty__</div>
    </bx_if:empty>
    <bx_if:pager>
        <div class="bx-analytics-pager">
            <button type="button" class="bx-analytics-pager-btn" data-bx-analytics-page="__prev__" data-bx-analytics-pager="__name__" __prev_disabled__>__txt_prev__</button>
            <span class="bx-analytics-pager-info">__txt_page__</span>
            <button type="button" class="bx-analytics-pager-btn" data-bx-analytics-page="__next__" data-bx-analytics-pager="__name__" __next_disabled__>__txt_next__</button>
        </div>
    </bx_if:pager>
</div>

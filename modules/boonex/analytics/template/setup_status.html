<div class="bx-analytics-table-wrap" role="region" aria-label="__caption__" tabindex="0">
    <table class="bx-analytics-table bx-analytics-tool-table">
        <caption class="bx-analytics-sr">__caption__</caption>
        <thead>
            <tr>
                <th scope="col" class="bx-analytics-col-text">__col_platform__</th>
                <th scope="col" class="bx-analytics-col-text">__col_status__</th>
                <th scope="col" class="bx-analytics-col-text">__col_last__</th>
                <th scope="col">__col_hits__</th>
                <th scope="col">__col_visitors__</th>
                <th scope="col">__col_sessions__</th>
                <th scope="col" class="bx-analytics-col-text">__col_version__</th>
            </tr>
        </thead>
        <tbody>
            <bx_repeat:rows>
                <tr>
                    <td class="bx-analytics-col-text bx-analytics-col-strong">__platform_title__</td>
                    <td class="bx-analytics-col-text"><span class="bx-analytics-state bx-analytics-state-__status__">__status_icon__<span>__status_title__</span></span></td>
                    <td class="bx-analytics-col-text">__last__</td>
                    <td>__hits__</td>
                    <td>__visitors__</td>
                    <td>__sessions__</td>
                    <td class="bx-analytics-col-text">__version__</td>
                </tr>
            </bx_repeat:rows>
        </tbody>
    </table>
</div>

<div class="bx-analytics-member">
    <bx_if:thumb><img class="bx-analytics-member-thumb" src="__thumb__" alt="" /></bx_if:thumb>
    <bx_if:no_thumb><span class="bx-analytics-member-thumb bx-analytics-member-guest" aria-hidden="true">?</span></bx_if:no_thumb>

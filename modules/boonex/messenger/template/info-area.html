<div id="bx-messenger-info-area">
    <div class="bx-messenger-conversations-typing">
        <i class="sys-icon messages-square bx-messenger-info-area-status-icon" aria-hidden="true"></i>
        <span class="names"></span><bx_text:_bx_messenger_typing_message />
    </div>
    <div class="bx-messenger-info-area-connecting">
        <i class="sys-icon refresh-ccw bx-messenger-info-area-status-icon bx-messenger-info-area-status-icon-spin" aria-hidden="true"></i>
        <bx_text:_bx_messenger_reconnecting_message /><span></span>
    </div>
    <div class="bx-messenger-info-area-connect-failed">
        <i class="sys-icon circle-exclamation-point bx-messenger-info-area-status-icon" aria-hidden="true"></i>
        <bx_text:_bx_messenger_reconnecting_failed />
    </div>
</div>

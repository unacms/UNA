<div class="__class__ bx-files-text-unit-gallery bx-base-text-unit bx-base-text-unit-gallery bx-base-content-card bx-def-gal-unit-size flex flex-col w-full p-2 box-border bx-file-entry" file_id="__id__">
    <div class="bx-base-text-unit-cnt bx-base-content-card-cnt bx-def-box bx-def-color-bg-box">
        <bx_if:thumb>
            <a class="bx-base-content-card-media" href="__content_url__" onclick="__alt_content_url_handler__" aria-hidden="true" tabindex="-1">
                <span class="bx-base-content-card-img" style="background-image:url(__gallery_url__)"></span>
            </a>
        </bx_if:thumb>
        <bx_if:no_thumb>
            <a class="bx-base-content-card-media" href="__content_url__" onclick="__alt_content_url_handler__" aria-hidden="true" tabindex="-1">
                <span class="bx-base-content-card-icon"><i class="sys-icon __icon__"></i></span>
            </a>
        </bx_if:no_thumb>
        <div class="bx-base-text-unit-text bx-base-content-card-info">
            <div class="bx-base-content-card-name">
                <a class="bx-files-filename bx-base-content-card-title" href="__content_url__" onclick="__alt_content_url_handler__">__title__</a>
                <div class="bx-base-text-unit-badges">__badges__</div>
            </div>
            <bx_if:meta><div class="bx-base-text-unit-info bx-base-content-card-meta"><div class="bx-base-general-unit-meta">__meta__</div></div></bx_if:meta>
            <bx_if:inline_menu>
                <div class="bx-files-inline-menu bx-clearfix">__menu__</div>
            </bx_if:inline_menu>
        </div>
    </div>
</div>

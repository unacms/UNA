<bx_repeat:menu_items>
    <li class="bx-sidebar-item bx-sidebar-item-__name____class_add__ group flex flex-col text-sm font-medium">
        <a class="bx-stl-mil" href="__link__" <bx_if:onclick>onclick="__onclick__"</bx_if:onclick> __attrs__>
            <span class="bx-si-icon bx-stl-mii flex-shrink-0 group-hover:text-gray-700 dark:group-hover:text-gray-300">
                <bx_include_auto:menu_icon.html />
            </span>
            <span class="bx-si-title bx-stl-mit flex-1">__title__</span>
            <span class="bx-si-dropdown-icon justify-center items-center flex-shrink-0 h-5 w-5 ml-2 transform rotate-0 transition-transform ease-in-out duration-150 text-gray-300 hover:text-gray-400 hidden">
                <bx_image_auto:caret-right />
            </span>
        </a>
        <bx_if:show_submenu>
            <ul class="bx-sidebar-dropdown-content hidden">
                <bx_repeat:submenu_items>
                    <li class="group flex items-center pl-6 text-sm font-medium">
                        <a class="bx-stl-mil flex-1" href="__link__" onclick="__onclick__"__attrs__>
                            <span class="bx-si-icon bx-stl-mii flex-shrink-0 group-hover:text-gray-700 dark:group-hover:text-gray-300">
                                <bx_include_auto:menu_icon.html />
                            </span>
                            <bx_if:title>
                                <span class="bx-si-title bx-stl-mit flex-1">__title__</span>
                            </bx_if:title>
                        </a>
                    </li>
                </bx_repeat:submenu_items>
            </ul>
        </bx_if:show_submenu>
    </li>
</bx_repeat:menu_items>

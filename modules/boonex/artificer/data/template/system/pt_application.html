<bx_include_auto:_header.html />
<div id="bx-content-preload" class="hidden"></div>
<div class="bx-main bx-pt-application <bx_injection:injection_main_class />">
    <bx_injection:top />
    <!-- BEG: Navigation: the standard header (_page_toolbar.html) with the sidebar's button before the logo, so the header's styles
         (#bx-toolbar in tailwind.css: the main menu's tabs, the toolbar's buttons, the popups) are the same in both layouts. -->
    <header id="bx-toolbar" class="bx-header bx-def-z-index-nav fixed top-0 w-full shadow-[inset_0_-1px_0_0_rgb(255_255_255/0.5),0_1px_8px_-1px_rgb(0_0_0/0.1),0_1px_0_0_var(--tw-shadow-color,rgb(0_0_0/0.025))] dark:shadow-[inset_0_-1px_0_0_rgb(255_255_255/0.05),0_1px_8px_-1px_rgb(0_0_0/0.5),0_1px_0_0_var(--tw-shadow-color,rgb(0_0_0/0.25))] bg-white/60 dark:bg-gray-800/60 backdrop-blur-lg">
        <div class="bx-header-cnt __sys_header_width__ __sys_header_align__ mx-auto px-4 box-border">
            <div class="bx-toolbar-content-wrapper">
                <div id="bx-toolbar-content" class="bx-toolbar-content relative flex items-center justify-start h-16">
                    <!-- Sidebar toggle: a header button (44px, as the member toolbar's), centred over the narrow sidebar's 64px -->
                    <button type="button" id="toggleSidebar" aria-expanded="true" aria-controls="sidebar" title="<bx_text_attribute:_sys_menu_item_title_system_main_menu />" aria-label="<bx_text_attribute:_sys_menu_item_title_system_main_menu />" class="bx-sidebar-toggle hidden xl:inline-flex flex-none items-center justify-center h-11 w-11 ltr:-ml-1.5 rtl:-mr-1.5 ltr:mr-4 rtl:ml-4 rounded-full cursor-pointer">
                        <span class="bx-icon bx-icon-hamburger flex items-center justify-center">
                            <bx_image_auto:bars />
                        </span>
                    </button>
                    <button type="button" id="toggleSidebarMobile" aria-expanded="false" aria-controls="sidebar" title="<bx_text_attribute:_sys_menu_item_title_system_main_menu />" aria-label="<bx_text_attribute:_sys_menu_item_title_system_main_menu />" class="bx-sidebar-toggle inline-flex xl:hidden flex-none items-center justify-center h-11 w-11 ltr:mr-3 rtl:ml-3 rounded-full cursor-pointer">
                        <span id="toggleSidebarMobileHamburger" class="bx-icon bx-icon-hamburger flex items-center justify-center">
                            <bx_image_auto:bars />
                        </span>
                        <span id="toggleSidebarMobileClose" class="bx-icon bx-icon-close hidden flex items-center justify-center">
                            <bx_image_auto:times />
                        </span>
                    </button>
                    <div class="bx-toolbar-items-group relative flex flex-1 items-center justify-start h-16">
                        <!-- Logo -->
                        <div id="bx-logo-container" class="bx-toolbar-item bx-ti-left bx-ti-logo flex-none items-center">
                            <bx_injection:injection_logo_before />
                            __main_logo__
                            <bx_injection:injection_logo_after />
                        </div>
                        <!-- Menu -->
                        <div class="bx-toolbar-item bx-ti-menu flex-2 hidden xl:block w-64 min-w-0 ltr:ml-8 rtl:mr-8 ltr:mr-6 rtl:ml-6">
                            <nav id="bx-menu-toolbar-1-container" class="bx-toolbar-item bx-ti-menu w-full">
                                <bx_menu:sys_application />
                            </nav>
                        </div>
                        <!-- Search box, opened by the 'search' item of the member toolbar -->
                        __sys_toolbar_search__
                    </div>
                    <bx_menu:sys_toolbar_member />
                </div>
            </div>
        </div>
    </header>
    <!-- END: Navigation -->

    <div class="bx-main-content flex pt-16 overflow-hidden">
        <!-- BEG: Sidebar -->
        <aside id="sidebar" class="bx-main-column narrow fixed top-0 left-0 z-20 hidden xl:flex flex-col flex-shrink-0 w-64 h-full pt-16 duration-75 transition-width" aria-label="Sidebar">
            <div class="bx-mc-border relative flex flex-col flex-1 min-h-0 max-h-full h-full pt-0 bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700">
                <div class="flex flex-col flex-1 py-2 overflow-y-auto">
                    <div class="bx-mc-cnt flex-1 px-2 space-y-1 bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                        <bx_menu:sys_site_panel />
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 justify-center hidden w-full p-4 space-x-4 xl:flex" sidebar-bottom-menu>
                    <!-- Some button based menu may be here -->
                </div>
            </div>
        </aside>
        <div class="fixed inset-0 z-10 hidden bg-gray-900/50 dark:bg-gray-900/90" id="sidebarBackdrop"></div>
        <!-- END: Sidebar -->    

        <!-- BEG: Main Content -->
        <div id="main-content" class="bx-main-column wide relative w-full h-full overflow-y-auto xl:ml-64">
            <main role="main" id="bx-content-main" tabindex="-1">
                <bx_injection:injection_between_cover_logo />
                __cover__
                <bx_injection:injection_between_cover_top_menu />
                <div id="bx-menu-main-bar-wrapper" class="bx-menu-main-bar-wrapper bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 __site_submenu_hidden__">
                    <div id="bx-menu-main-bar" class="bx-menu-main-bar __site_submenu_class__ mx-auto px-4 sm:px-6 lg:px-8 box-border">
                        <div class="bx-menu-main-bar-cnt -mb-px">
                            <bx_injection:injection_top_menu_before />
                            <div class="flex items-center h-full text-center">
                                <div class="relative flex-1 h-full">
                                    <div class="absolute w-full h-full">
                                        <bx_menu:sys_site_submenu />
                                    </div>
                                </div>
                                <div class="flex-none">
                                    <bx_menu:sys_site_manage />
                                </div>
                            </div>
                            <bx_injection:injection_top_menu_after />
                        </div>
                    </div>
                </div>
                <bx_injection:injection_between_content_menu />
                <div id="bx-content-wrapper" class="bx-def-page-width mx-auto">
                    __informer__
                    <div class="bx-page-wrapper mx-auto px-3 md:px-4 lg:px-6 box-border">
                        <div id="bx-content-container" class="bx-content-container">
                            <div class="bx-content-main my-2 lg:my-3">
                                <bx_injection:injection_content_before />
                                __page_main_code__
                                <bx_injection:injection_content_after />
                                <bx_injection:banner_bottom />
                            </div> <!-- .bx-content-main -->
                            <bx_injection:injection_between_content_footer />
                        </div> <!-- #bx-content-container -->
                    </div> <!-- .bx-page-wrapper -->
                </div> <!-- #bx-content-wrapper -->
            </main> <!-- #bx-content-main -->
            <footer class="p-4 m-4 bg-white rounded-lg shadow md:flex md:items-center md:justify-between md:p-6 xl:p-8 dark:bg-gray-800">
                <bx_injection:injection_footer_before />
                <div id="bx-menu-bottom">
                    <bx_menu:sys_footer />
                </div>
                <bx_injection:injection_footer_after />
            </footer>
        </div>
        <!-- END: Main Content -->
    </div>
    <bx_menu:sys_site_action />
</div> <!-- .bx-main -->
<bx_include_auto:_footer.html />

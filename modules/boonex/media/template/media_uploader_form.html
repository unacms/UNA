<div class="relative">
<div class="bx-popup-header bx-media-popup-header">
	  <h2>
		  <bx_text:_bx_media_uploader_popup_title />
	  </h2>
</div>	
<div class="bx_media_container">
    <div class="bx_media_cell">
        <div id="__form_container_id__" class="bx-uploader-form-cont">
            <form enctype="multipart/form-data" method="POST" target="__iframe_id__" action="
                <bx_url_root />storage_uploader.php" onsubmit="__uploader_instance_name__.beforeUpload(this);">
                <div class="bx-uploader-loading"></div>
                <div class="bx-uploader-files-list">

                    <div id="__errors_container_id__"></div>
                    <div class="bx-uploader-simple-file "><label for="__form_container_id__-file" class="sr-only"><bx_text:_bx_media_uploader_button_title /></label><input id="__form_container_id__-file" name="f[]" __accepted_files__ type="file" /></div>
                </div>

            </form>
        </div>
        <div class="bx-def-font-small bx_media_hint"><bx_text:_bx_media_txt_click_to_edit /></div>
        <div class="bx-def-font-small">__restrictions_text__</div>
    </div>
</div>
<bx_if:recent_files>
	<br>
    <strong><bx_text:_bx_media_subheader_recent_files /></strong>
    <div class="bx_media_lists">
        <div class="bx_media_lists_container" style="width:__list_width__">
            <bx_repeat:items>
                <div class="bx_media_list_item_container bx-def-round-corners">
					<div class="bx_media_list_item bx-def-round-corners " style="background-image:url(__url__)" data-id="__object__-__id__">
                    	<button class="filepond--file-action-button filepond--action-edit-item" type="button" data-align="bottom center" style="transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1); opacity: 1;">
							<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
								<path d="M8.5 17h1.586l7-7L15.5 8.414l-7 7V17zm-1.707-2.707l8-8a1 1 0 0 1 1.414 0l3 3a1 1 0 0 1 0 1.414l-8 8A1 1 0 0 1 10.5 19h-3a1 1 0 0 1-1-1v-3a1 1 0 0 1 .293-.707z" fill="currentColor" fill-rule="nonzero"></path>
							</svg>
						</button>
                	</div>
				</div>
				<script>__uploader_instance_name__.initFile('__object__-__id__', '__id__', '__object__', '__url__');</script>
            </bx_repeat:items>
        </div>
    </div>
</bx_if:recent_files>

<div class="bx-def-padding-top bx-clearfix">
    <button type="button" class="bx-btn" onclick="__uploader_instance_name__.uploadSelectedFiles(this)">
		<bx_text:_bx_media_uploader_button_done_title />
	</button>
</div>
<button type="button" class="bx_media_close_button" onclick="__uploader_instance_name__.close()" title="<bx_text:_bx_media_editor_close />">
	<i class="sys-icon times"></i>
</button>
</div>
<script>
var aLabels = {
	labelIdle: '<span class="filepond--label-action"><bx_text:_bx_media_uploader_filepond_labelIdle /></span>',
	labelInvalidField: '<bx_text:_bx_media_uploader_filepond_labelInvalidField />',
	labelFileWaitingForSize: '<bx_text:_bx_media_uploader_filepond_labelFileWaitingForSize />',
	labelFileSizeNotAvailable: '<bx_text:_bx_media_uploader_filepond_labelFileSizeNotAvailable />',
	labelFileCountSingular: '<bx_text:_bx_media_uploader_filepond_labelFileCountSingular />',
	labelFileCountPlural: '<bx_text:_bx_media_uploader_filepond_labelFileCountPlural />',
	labelFileLoading: '<bx_text:_bx_media_uploader_filepond_labelFileLoading />',
	labelFileAdded: '<bx_text:_bx_media_uploader_filepond_labelFileAdded />',
	labelFileLoadErro: '<bx_text:_bx_media_uploader_filepond_labelFileLoadError />',
	labelFileRemoved: '<bx_text:_bx_media_uploader_filepond_labelFileRemoved />',
	labelFileRemoveError: '<bx_text:_bx_media_uploader_filepond_labelFileRemoveError />',
	labelFileProcessing: '<bx_text:_bx_media_uploader_filepond_labelFileProcessing />',
	labelFileProcessingComplete: '<bx_text:_bx_media_uploader_filepond_labelFileProcessingComplete />',
	labelFileProcessingAborted: '<bx_text:_bx_media_uploader_filepond_labelFileProcessingAborted />',
	labelFileProcessingError: '<bx_text:_bx_media_uploader_filepond_labelFileProcessingError />',
	labelFileProcessingRevertError: '<bx_text:_bx_media_uploader_filepond_labelFileProcessingRevertError />',
	labelTapToCancel: '<bx_text:_bx_media_uploader_filepond_labelTapToCancel />',
	labelTapToRetry: '<bx_text:_bx_media_uploader_filepond_labelTapToRetry />',
	labelTapToUndo: '<bx_text:_bx_media_uploader_filepond_labelTapToUndo />',
	labelButtonRemoveItem: '<bx_text:_bx_media_uploader_filepond_labelButtonRemoveItem />',
	labelButtonAbortItemLoad: '<bx_text:_bx_media_uploader_filepond_labelButtonAbortItemLoad />',
	labelButtonRetryItemLoad: '<bx_text:_bx_media_uploader_filepond_labelButtonRetryItemLoad />',
	labelButtonAbortItemProcessing: '<bx_text:_bx_media_uploader_filepond_labelButtonAbortItemProcessing />',
	labelButtonUndoItemProcessing: '<bx_text:_bx_media_uploader_filepond_labelButtonUndoItemProcessing />',
	labelButtonRetryItemProcessing: '<bx_text:_bx_media_uploader_filepond_labelButtonRetryItemProcessing />',
	labelButtonProcessItem: '<bx_text:_bx_media_uploader_filepond_labelButtonProcessItem />',
	labelButtonProcessAll: '<bx_text:_bx_media_uploader_filepond_labelButtonProcessAll />',
}
__uploader_instance_name__.popupShow(aLabels)
</script>

<div class="bx-tasks-time-summary">
    <bx_if:show_periods>
        <div class="bx-tasks-ts-periods">
            <label class="bx-tasks-ts-label" for="__select_id__"><bx_text:_bx_tasks_txt_time_period /></label>
            <select id="__select_id__" class="bx-def-font-inputs bx-form-input-select" onchange="$(this).parents('.bx-tasks-time-summary:first').find('.bx-tasks-ts-period').hide().filter('[data-period=' + this.value + ']').show();">
                <bx_repeat:options><option value="__value__"__selected__>__title__</option></bx_repeat:options>
            </select>
        </div>
    </bx_if:show_periods>
    <bx_repeat:periods>
        <div class="bx-tasks-ts-period" data-period="__name__"__style__>
            <bx_if:show_empty>
                <div class="bx-tasks-ts-empty">__empty__</div>
            </bx_if:show_empty>
            <bx_if:show_table>
                <div class="bx-tasks-ts-scroll">
                    <table class="bx-tasks-ts-table">
                        <thead><tr><th class="bx-tasks-ts-name" scope="col"></th><bx_repeat:columns><th class="bx-tasks-ts-time" scope="col">__ts_h_value__</th></bx_repeat:columns></tr></thead>
                        <tbody>
                            <bx_repeat:rows>
                                <tr class="__ts_r_class__">
                                    <td class="bx-tasks-ts-name"><bx_if:ts_link><a href="__ts_l_url__">__ts_l_title__</a></bx_if:ts_link><bx_if:ts_text>__ts_t_value__</bx_if:ts_text><bx_if:ts_log><span class="bx-tasks-ts-date">__ts_g_date__</span> <span class="bx-tasks-ts-note">__ts_g_text__</span></bx_if:ts_log></td>
                                    <bx_repeat:cells><td class="bx-tasks-ts-time">__ts_c_value__</td></bx_repeat:cells>
                                </tr>
                            </bx_repeat:rows>
                        </tbody>
                    </table>
                </div>
            </bx_if:show_table>
        </div>
    </bx_repeat:periods>
</div>

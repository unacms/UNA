<div id="bx-auth-form" class="controlsDiv">
    <h3>__text__</h3>
<bx_if:native_app><bx_if:scope_api>    <p class="bx-auth-form-info">__scope_api_text__</p>
</bx_if:scope_api><bx_if:redirect>    <p class="bx-auth-form-info">__redirect_text__</p>
</bx_if:redirect></bx_if:native_app>    <form method="post" action="__url__">
        <input type="hidden" name="profile_id" id="bx-auth-profile-id" value="0" />
        <input type="hidden" name="csrf_token" value="__csrf_token__" />
        <input type="hidden" name="client_id" value="__client_id__" />
        <input type="hidden" name="response_type" value="__response_type__" />
        <input type="hidden" name="redirect_uri" value="__redirect_uri__" />
        <input type="hidden" name="scope" value="__scope__" />
        <input type="hidden" name="state" value="__state__" />
<bx_if:pkce>        <input type="hidden" name="code_challenge" value="__code_challenge__" />
        <input type="hidden" name="code_challenge_method" value="__code_challenge_method__" />
</bx_if:pkce>        <div class="bx-auth-form-profiles">
            __profiles__
        </div>
        <div class="bx-auth-form-buttons bx-def-margin-top">
            <button class="bx-btn" onclick="$('#bx-auth-profile-id').val(0); $('#bx-auth-form form').submit(); return false;"><bx_text:_Cancel /></button>
        </div>
    </form>
</div>

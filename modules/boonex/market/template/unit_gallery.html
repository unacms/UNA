<div class="__class__ bx-base-text-unit bx-base-text-unit-gallery bx-base-content-card bx-def-gal-unit-size flex flex-col w-full p-2 box-border">
    <div class="bx-market-unit-gallery-cnt bx-base-content-card-cnt bx-def-box bx-def-color-bg-box">
        <bx_if:show_cover>
            <a class="bx-base-content-card-media" href="__content_url__" aria-hidden="true" tabindex="-1">
                <span class="bx-base-content-card-img" style="background-image:url(__cover_url__)"></span>
            </a>
        </bx_if:show_cover>
        <bx_if:show_cover_raw>
            <a class="bx-base-content-card-media" href="__content_url__" aria-hidden="true" tabindex="-1">
                <span class="bx-base-content-card-img bx-base-text-unit-thumb-raw">__cover_raw__</span>
            </a>
        </bx_if:show_cover_raw>
        <div class="bx-base-content-card-info">
            <div class="bx-base-content-card-name">
                <a class="bx-base-content-card-title" href="__content_url__">__title__</a>
                <div class="bx-base-text-unit-badges">__badges__</div>
            </div>
            <div class="bx-base-content-card-summary">__summary_plain__</div>
            <div class="bx-base-content-card-foot">
                <bx_if:meta><div class="bx-base-content-card-meta"><div class="bx-base-general-unit-meta">__meta__</div></div></bx_if:meta>
                <bx_if:show_section_voting><span class="bx-base-content-card-price">__pricing__</span></bx_if:show_section_voting>
            </div>
        </div>
    </div>
</div>

<div class="__class__ box-border">
    <div class="bx-base-pofile-unit-cnt bx-base-pofile-card-cnt bx-def-box bx-def-color-bg-box">
        <a class="bx-base-pofile-card-picture" href="__content_url__" onclick="__content_click__" aria-hidden="true" tabindex="-1">
            <bx_if:show_thumbnail>
                <bx_if:show_thumb_image>
                    <img alt="" class="bx-base-pofile-card-img" src="__thumb_url__" loading="lazy" />
                </bx_if:show_thumb_image>
                <bx_if:show_thumb_letter>
                    <span class="bx-base-pofile-card-letter" style="background-color:rgba(__color__)">__letter__</span>
                </bx_if:show_thumb_letter>
                <bx_if:show_online>
                    <span class="bx-base-pofile-unit-online"></span>
                </bx_if:show_online>
            </bx_if:show_thumbnail>
        </a>
        <div class="bx-base-pofile-card-info bx-menu-btn-size-small">
            <div class="bx-base-pofile-card-name">
                <a href="__content_url__" onclick="__content_click__" class="bx-base-pofile-card-title hover:underline">__title__</a>
                __badges__
                <span class="text-sm text-gray-500 dark:text-gray-400">__addon__</span>
            </div>
            <div class="bx-base-pofile-unit-info bx-base-pofile-card-meta">
                <bx_if:meta><div class="bx-base-general-unit-meta">__meta__</div></bx_if:meta>
                <bx_if:show_view>
                    <div class="bx-base-pofile-card-view">
                        <a class="bx-btn bx-btn-primary" href="__content_url__" onclick="__content_click__"><i class="sys-icon user-circle"></i><u>__view__</u></a>
                        <bx_if:show_you>
                            <span class="bx-base-pofile-card-you text-gray-600 dark:text-gray-400 border-gray-300 dark:border-gray-600">__you__</span>
                        </bx_if:show_you>
                    </div>
                </bx_if:show_view>
            </div>
        </div>
    </div>
</div>

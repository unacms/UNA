<div id="bx-dbd-htools">
    <bx_if:show_content>
        <div class="bx-dbd-htools">
            <div id="bx-dbd-htools-status" class="bx-dbd-htools-panel" role="tabpanel" aria-labelledby="bx-dbd-htools-tab-status">
                <div class="bx-dbd-hero bx-dbd-gauges">
                    <bx_repeat:gauges>
                        <div class="bx-dbd-gauge bx-dbd-gauge-__name____class_add__">
                            <div class="bx-dbd-gauge-ring" role="img" aria-label="__title__: __label__">
                                <svg viewBox="0 0 96 96" aria-hidden="true">
                                    <circle class="bx-dbd-gauge-track" cx="48" cy="48" r="40" />
                                    <circle class="bx-dbd-gauge-arc" cx="48" cy="48" r="40" stroke-dasharray="__dash__ __ring__" />
                                </svg>
                                <div class="bx-dbd-gauge-value" aria-hidden="true">__value__<bx_if:show_unit><small class="bx-dbd-gauge-unit">__unit__</small></bx_if:show_unit></div>
                            </div>
                            <div class="bx-dbd-gauge-label" aria-hidden="true">__title__</div>
                        </div>
                    </bx_repeat:gauges>
                </div>
                <div class="bx-dbd-htools-items">
                    <bx_repeat:items>
                        <div class="bx-dbd-htools-item bx-dbd-htools-item-__status__"><span class="bx-dbd-tile" aria-hidden="true">__icon__</span><span class="bx-dbd-htools-name">__title__<span class="bx-dbd-htools-status sr-only">, __status_title__</span><bx_if:show_desc><span class="bx-dbd-htools-desc">__desc__</span></bx_if:show_desc></span><b class="bx-dbd-htools-value">__value__</b><span class="bx-dbd-htools-dot" aria-hidden="true"></span></div>
                    </bx_repeat:items>
                </div>
            </div>
            <div id="bx-dbd-htools-audit" class="bx-dbd-htools-panel" role="tabpanel" aria-labelledby="bx-dbd-htools-tab-audit" data-action="server_audit" hidden></div>
        </div>
    </bx_if:show_content>
    <bx_if:show_loader>
        <script language="javascript">
            $(document).ready(function() {
                __js_object__.checkHostParams();
            });
        </script>
    </bx_if:show_loader>
</div>

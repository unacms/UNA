<div id="bx-std-widget-__id__" class="bx-std-widget __widget_disabled_class__" style="__widget_styles__" data-name="__name__" role="listitem">
    <div class="bx-std-widget-cont">
        <div class="bx-std-widget-icon bx-std-widget-icon-trans rounded-2xl hover:ring hover:ring-gray-300 dark:hover:ring-gray-700 hover:ring-offset-1 hover:ring-offset-gray-200 dark:hover:ring-offset-black hover:scale-105 active:scale-100 active:opacity-80 duration-300">
            <a class="bx-std-widget-link block rounded-2xl bx-icon-tile" href="__url__" aria-label="__caption_attr__" <bx_if:show_context_menu>data-bx-context-menu="#bx-std-cmenu-__page__" data-bx-context-menu-load="__page__:__id__"</bx_if:show_context_menu> <bx_if:show_click_icon>onClick="__content__"</bx_if:show_click_icon>>
                <bx_if:icon>
                    <img src="<bx_icon_url:wi-empty.png />" alt="" />
                    <i class="sys-icon __icon__"></i>
                </bx_if:icon>
                <bx_if:image><img src="__icon_url__" alt="" /></bx_if:image>
            </a>
        </div>
        <bx_if:show_notice>
           <div class="bx-std-widget-notices">__content__</div>
        </bx_if:show_notice>

        <bx_if:show_actions_left>
            <div class="bx-std-widget-actions left">
                <div class="bx-std-widget-actions-cnt">
                    <bx_repeat:actions>
                        <div class="bx-std-widget-action bg-gray-200 dark:bg-gray-800 border border-black/10 dark:border-white/10 rounded-2xl">__action__</div>
                    </bx_repeat:actions>
                </div>
            </div>
        </bx_if:show_actions_left>
        <!-- Edit mode: the move controls are the non-drag way to reorder (the stack is only shown on the launcher), then the app's other actions. -->
        <div class="bx-std-widget-actions right">
            <div class="bx-std-widget-actions-cnt">
                <div class="bx-std-widget-action bg-gray-200 dark:bg-gray-800 border border-black/10 dark:border-white/10 rounded-2xl">
                    <button type="button" class="bx-std-widget-action bx-std-wa-move-left text-gray-600 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300" onclick="oBxDolStudioLauncher.move(this, -1)" aria-label="__move_left__" title="__move_left__"><bx_icon_inline:wi-act-move-left.svg /></button>
                </div>
                <div class="bx-std-widget-action bg-gray-200 dark:bg-gray-800 border border-black/10 dark:border-white/10 rounded-2xl">
                    <button type="button" class="bx-std-widget-action bx-std-wa-move-right text-gray-600 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300" onclick="oBxDolStudioLauncher.move(this, 1)" aria-label="__move_right__" title="__move_right__"><bx_icon_inline:wi-act-move-right.svg /></button>
                </div>
                <bx_repeat:actions_right>
                    <div class="bx-std-widget-action bg-gray-200 dark:bg-gray-800 border border-black/10 dark:border-white/10 rounded-2xl">__action__</div>
                </bx_repeat:actions_right>
            </div>
        </div>

        <div class="bx-std-widget-icon-jitter" style="display:none"></div>
        <div class="bx-std-widget-loading"></div>

        <div class="bx-std-widget-caption">
            <span class="bx-std-widget-link text-xs text-black/70 dark:text-white/70" title="__caption_attr__" aria-hidden="true">__caption__</span>
            <div class="bx-std-widget-caption-jitter" style="display:none"></div>
        </div>
    </div>
</div>

<bx_injection:top />
<header id="bx-toolbar" class="bx-header bx-def-z-index-nav fixed top-0 w-full smooth-shadow-ring-sm bg-white/95 dark:bg-gray-800/95 backdrop-blur">
    <div class="bx-header-cnt __sys_header_width__ mx-auto px-3 md:px-4 lg:px-6 box-border">
        <div class="bx-toolbar-content-wrapper">
            <div id="bx-toolbar-content" class="bx-toolbar-content relative flex items-center justify-start h-16">
                <bx_menu:sys_toolbar_site />
                <div class="bx-toolbar-items-group relative flex flex-1 items-center justify-start h-16">
                    <!-- Logo -->
                    <div id="bx-logo-container" class="bx-toolbar-item bx-ti-left bx-ti-logo flex-none items-center">
                        <bx_injection:injection_logo_before />
                        __main_logo__
                        <bx_injection:injection_logo_after />
                    </div>
                    <!-- Menu -->
                    <div class="bx-toolbar-item bx-ti-menu flex-2 hidden lg:block w-64 ltr:ml-4 rtl:mr-4">
                        <nav id="bx-menu-toolbar-1-container" class="bx-toolbar-item bx-ti-menu w-full">
                            <bx_menu:sys_site />
                        </nav>
                    </div>
                    <!-- Search -->
                    <div class="bx-toolbar-item bx-ti-search flex-1 lg:flex-none flex items-center justify-end">
                        __sys_toolbar_search__
                    </div>
                </div>
                <bx_menu:sys_toolbar_member />
            </div>
        </div>
    </div>
</header>

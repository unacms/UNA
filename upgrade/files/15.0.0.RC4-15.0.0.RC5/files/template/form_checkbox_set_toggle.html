<div class="bx-form-input-checkbox_set-toggle">
    <button type="button" class="bx-form-input-checkbox_set-all" onclick="$(this).parents('.bx-form-input-checkbox_set:first').find('input[type=checkbox]:not(:disabled)').prop('checked', true).trigger('change');">__txt_all__</button>
    <button type="button" class="bx-form-input-checkbox_set-none" onclick="$(this).parents('.bx-form-input-checkbox_set:first').find('input[type=checkbox]:not(:disabled)').prop('checked', false).trigger('change');">__txt_none__</button>
</div>

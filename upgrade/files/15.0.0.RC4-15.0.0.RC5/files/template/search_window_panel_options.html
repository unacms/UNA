<fieldset id="__id__" class="bx-search-window-panel hidden mt-3 flex flex-col gap-2" data-name="__name__">
    <legend class="sr-only">__label__</legend>
    <div class="flex flex-wrap gap-x-4 gap-y-2">
        <bx_repeat:options><label class="inline-flex items-center gap-2 text-sm text-gray-800 dark:text-gray-200"><input type="__type__" name="bx_search_window___name__" value="__value__" __checked__ />__title__</label></bx_repeat:options>

</fieldset>

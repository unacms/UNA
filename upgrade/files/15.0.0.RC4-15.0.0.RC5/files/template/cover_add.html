<!-- A section's add action at the end of its tab row, where its title row (cover.html), which holds it, is off or hidden:
     the same button, glass prominent and small as the tabs, a pill with the label from lg, round and icon-only below. -->
<a class="bx-cover-add bx-btn bx-btn-primary bx-btn-glass bx-btn-small bx-btn-icon-mobile shrink-0 self-center ms-2 me-1 __class__" href="__url__" title="__title__" aria-label="__title__">__icon__<span class="bx-btn-icon-mobile-label">__label__</span></a>

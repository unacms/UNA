<!-- The informer: one strip right under the header, before the page's cover, tabs and blocks (_sub_header.html,
     pt_application.html), its fill from edge to edge and its content as wide as the page. Each message is a row of the
     strip with a line under it. -->
<div class="bx-informer-wrapper">
    <div id="bx-informer" role="status">
        <bx_repeat:messages>
            <div id="__id__" class="bx-informer-msg __class__">
                <div class="bx-informer-msg-cnt bx-def-page-width mx-auto px-4 box-border">
                    <div class="bx-informer-indicator" aria-hidden="true">
                        <bx_if:icon_html>__icon_html__</bx_if:icon_html>
                        <bx_if:icon_font><i class="sys-icon __icon__"></i></bx_if:icon_font>
                    </div>
                    <div class="bx-informer-body">
                        <div class="bx-informer-content">__msg__</div>
                        <bx_if:action>
                            <a class="bx-informer-action bx-btn bx-btn-small bx-btn-primary" href="__action_url__">__action_title__</a>
                        </bx_if:action>
                    </div>
                </div>
            </div>
        </bx_repeat:messages>
    </div>
</div>

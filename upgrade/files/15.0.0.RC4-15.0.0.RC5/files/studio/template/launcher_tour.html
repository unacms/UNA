<template id="bx-tour-close-icon"><div class="bx-icon bx-icon-close"><bx_icon_inline:tmi-close.svg /></div></template>
<script defer language="javascript">
    // The Studio introduction tour (BxDolTours, bx_tour in inc/js/functions.js): the few apps a new site is set up with.
    // A step whose app isn't in the launcher is left out.
    var glTour = bx_tour({
        name: '__name__',
        autostart: __autostart__,
        inert: '.bx-main',
        close_icon: '#bx-tour-close-icon',
        steps: [{
            id: 'tour-welcome',
            title: '<bx_text_js:_sys_tour_launcher_welcome_title />',
            text: '<bx_text_js:_sys_tour_launcher_welcome_txt />'
        },{
            id: 'tour-designer',
            title: '<bx_text_js:_sys_tour_launcher_designer_title />',
            text: '<bx_text_js:_sys_tour_launcher_designer_txt />',
            element: '.bx-std-widget-cont:has(.bx-std-widget-link[href*=designer])'
        },{
            id: 'tour-builder_page',
            title: '<bx_text_js:_sys_tour_launcher_builder_page_title />',
            text: '<bx_text_js:_sys_tour_launcher_builder_page_txt />',
            element: '.bx-std-widget-cont:has(.bx-std-widget-link[href*=builder_page])'
        },{
            id: 'tour-builder_menu',
            title: '<bx_text_js:_sys_tour_launcher_builder_menus_title />',
            text: '<bx_text_js:_sys_tour_launcher_builder_menus_txt />',
            element: '.bx-std-widget-cont:has(.bx-std-widget-link[href*=builder_menu])'
        },{
            id: 'tour-bx_accounts',
            title: '<bx_text_js:_sys_tour_launcher_accounts_title />',
            text: '<bx_text_js:_sys_tour_launcher_accounts_txt />',
            element: '.bx-std-widget-cont:has(.bx-std-widget-link[href*=bx_accounts])'
        },{
            id: 'tour-add-apps',
            title: '<bx_text_js:_sys_tour_launcher_add_apps_title />',
            text: '<bx_text_js:_sys_tour_launcher_add_apps_txt />',
            element: '.bx-std-widget-cont:has(.bx-std-widget-link[href*=store])'
        }],
        labels: {
            back: '<bx_text_js:_sys_tour_back />',
            next: '<bx_text_js:_sys_next />',
            done: '<bx_text_js:_sys_done />',
            close: '<bx_text_js:_sys_tour_close />',
            step: '<bx_text_js:_sys_tour_step />'
        }
    });
</script>

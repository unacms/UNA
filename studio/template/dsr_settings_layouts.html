<fieldset class="adm-dsg-choice-group">
    <legend class="adm-dsg-choice-legend">__caption__</legend>
    <div class="adm-dsg-choices">
<bx_repeat:layouts>
        <label class="adm-dsg-choice">
            <span class="adm-dsg-choice-art adm-dsg-pt adm-dsg-pt-__slug__" aria-hidden="true">
                <span class="adm-dsg-pt-header"></span>
                <span class="adm-dsg-pt-body">
                    <span class="adm-dsg-pt-side"></span>
                    <span class="adm-dsg-pt-content"><span></span><span></span><span></span></span>
                </span>
                <span class="adm-dsg-pt-footer"></span>
            </span>
            <span class="adm-dsg-choice-text">
                <span class="adm-dsg-choice-title"><input type="radio" class="adm-dsg-choice-input" name="__name__" value="__value__" __checked__ />__title__</span>
                <span class="adm-dsg-choice-info">__info__</span>
            </span>
        </label>
</bx_repeat:layouts>
    </div>
</fieldset>

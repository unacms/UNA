<div class="adm-dsg-logo-previews grid grid-cols-1 sm:grid-cols-2 gap-3">
<bx_repeat:previews>
    <div class="adm-dsg-logo-preview adm-dsg-lp-__name__ flex flex-col rounded-xl overflow-hidden bg-white dark:bg-white/5 ring-1 ring-black/10 dark:ring-white/10">
        <div class="adm-dsg-lp-stage adm-dsg-lp-__scheme__ flex items-center justify-center h-24 px-4">
            <bx_if:show_image><img class="block max-w-full h-10 object-contain" src="__url__" alt="__alt__" /></bx_if:show_image>
            <bx_if:show_code><span class="adm-dsg-lp-code block h-10 max-w-full" aria-hidden="true">__code__</span></bx_if:show_code>
            <bx_if:show_text><span class="adm-dsg-lp-text text-lg font-semibold">__text__</span></bx_if:show_text>
        </div>
        <div class="adm-dsg-lp-info flex flex-col items-start gap-1 p-3">
            <div class="adm-dsg-lp-caption text-sm font-medium text-gray-900 dark:text-gray-100">__caption__</div>
            <div class="adm-dsg-lp-source text-sm leading-5 text-gray-600 dark:text-gray-400">__info__</div>
            <bx_if:show_remove><button type="button" class="bx-btn bx-btn-small mt-1" aria-label="__label__" data-confirm="__confirm__" onclick="__js_object__.deleteLogo('__name__', this);"><bx_text:_adm_dsg_btn_logo_remove /></button></bx_if:show_remove>
        </div>
    </div>
</bx_repeat:previews>
</div>

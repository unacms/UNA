<ul class="bx-menu-toolbar gap-x-3">
    <bx_if:show_search>
        <li class="bx-menu-tab-search<bx_if:show_active> bx-mt-active</bx_if:show_active> flex-auto">
            <div class="bx-menu-tab-item">
                <a class="flex-none flex items-center justify-center aspect-square h-full text-gray-600 hover:text-gray-700" href="javascript:void(0)" onclick="return oBxDolStudioMenuTop.searchToggle(this)" aria-label="<bx_text_attribute:_adm_tmi_cpt_search />" aria-expanded="false">
                    <bx_icon_inline:tmi-search.svg />
                </a>
                <div class="bx-form-input-wrapper bx-form-input-wrapper-text">
                    <input type="text" name="search" value="" placeholder="<bx_text_attribute:_adm_tmi_cpt_search />" aria-label="<bx_text_attribute:_adm_tmi_cpt_search />" class="bx-def-font-inputs bx-form-input-text" onkeydown="return oBxDolStudioMenuTop.searchWidget(event)" />
                </div>
            </div>
        </li>
    </bx_if:show_search>
    <bx_repeat:menu_items>
        <li class="bx-menu-tab-__name__  __class_add__ bx-menu-tab-item">
            <a href="__link__" onclick="__onclick__" title="__title__"__attrs__><bx_if:icon><i class="sys-icon __icon__ bx-def-round-corners bx-def-font-contrasted"></i></bx_if:icon><bx_if:image><img src="__icon_url__" /></bx_if:image><bx_if:image_inline>__image__</bx_if:image_inline></a>
        </li>
    </bx_repeat:menu_items>
</ul>

<bx_if:show_title>
    <div class="bx-std-pcm-title text-2xl font-bold" id="bx-std-pc-title">
        <div class="bx-std-pcm-title-cnt flex justify-between pl-2">
            <div>__title__</div>
            <bx_if:show_actions>
                <div>
                    <button type="button" class="bx-std-pcm-actions flex justify-center items-center w-10 h-10 bg-gray-200 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-black/10 dark:border-white/10 rounded-lg text-gray-600 dark:text-gray-400" __attrs__ aria-haspopup="menu" aria-expanded="false" onclick="return oBxDolStudioContextMenu.open(this)" title="<bx_text_attribute:_adm_txt_show_actions />" aria-label="<bx_text_attribute:_adm_txt_show_actions />">
                        <bx_icon_inline:mi-cog.svg />
                    </button>
                </div>
            </bx_if:show_actions>
        </div>
    </div>
</bx_if:show_title>
<div class="bx-std-pcm-menu" id="bx-std-pc-menu">__menu__</div>

<fieldset class="adm-dsg-header-row">
    <legend class="adm-dsg-header-row-legend">__caption__</legend>
    <div class="adm-dsg-choices adm-dsg-choices-compact">
<bx_repeat:choices>
        <label class="adm-dsg-choice">
            <span class="adm-dsg-choice-art adm-dsg-hd adm-dsg-hd-width-__width__ adm-dsg-hd-align-__align__" aria-hidden="true">
                <span class="adm-dsg-hd-bar">
                    <span class="adm-dsg-hd-inner">
                        <span class="adm-dsg-hd-logo"></span>
                        <span class="adm-dsg-hd-menu"><span></span><span></span><span></span></span>
                        <span class="adm-dsg-hd-tools"></span>
                    </span>
                </span>
                <span class="adm-dsg-hd-body"></span>
            </span>
            <span class="adm-dsg-choice-text">
                <span class="adm-dsg-choice-title"><input type="radio" class="adm-dsg-choice-input" name="__name__" value="__value__" __checked__ />__title__</span>
            </span>
        </label>
</bx_repeat:choices>
    </div>
</fieldset>

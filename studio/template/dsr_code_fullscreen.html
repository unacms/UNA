<div class="adm-dsg-code-tools">
    <button type="button" class="bx-btn bx-btn-small" aria-haspopup="dialog" aria-label="<bx_text_attribute:_adm_dsg_btn_code_fullscreen />: __title_attr__" onclick="__js_object__.openCodeFullscreen(this, '__dialog_id__', '__field__');"><bx_text:_adm_dsg_btn_code_fullscreen /></button>
</div>
<dialog id="__dialog_id__" class="adm-dsg-fullscreen" aria-labelledby="__dialog_id__-title">
    <div class="adm-dsg-fs-header">
        <h2 id="__dialog_id__-title" class="adm-dsg-fs-title">__title__</h2>
        <div class="adm-dsg-fs-actions">
<bx_if:show_preview>
            <button type="button" class="bx-btn bx-btn-small" aria-haspopup="dialog" onclick="__js_object__.openPreviewFullscreen(this, '__preview_dialog_id__', '__preview_frame_id__', '__preview_url__');"><bx_text:_adm_dsg_btn_splash_preview /></button>
</bx_if:show_preview>
            <button type="button" class="bx-btn bx-btn-small bx-btn-primary" onclick="this.closest('dialog').close();"><bx_text:_adm_dsg_btn_fullscreen_done /></button>
        </div>
    </div>
    <div class="adm-dsg-fs-body adm-dsg-fs-code"></div>
</dialog>

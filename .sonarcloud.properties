# SonarCloud automatic analysis scope. Mirrors the project's UI settings and adds
# modules/**/plugins/**: third-party libraries bundled by modules (Composer vendor
# dirs, JS players), which UNA does not maintain.
sonar.exclusions=modules/**/updates/**,modules/**/plugins/**,upgrade/**,patches/**,samples/**,scripts/**,tests/**
sonar.cpd.exclusions=**
sonar.coverage.exclusions=**
